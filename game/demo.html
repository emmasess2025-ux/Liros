<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overhead Chat Demo</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #222; 
            touch-action: none; 
            font-family: sans-serif; 
            
            /* Stops Safari/Chrome from highlighting elements */
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            -moz-user-select: none;      
            -ms-user-select: none;       
            user-select: none;           
        }        

        /* Universal iOS Lockdown */
        * {
            -webkit-tap-highlight-color: transparent; /* Kills the grey flash when tapping */
        }
        
        canvas { display: block; 
                    touch-action: none; /* Double-secures no native zooming */ }
        
       /* Expanding Chat UI */
        #chat-container {
            position: absolute;
            top: 20px;
            left: 20px; /* Moved to Top Left */
            height: 45px;
            width: 45px; /* Starts as a small circle */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1); /* Smooth snap expansion */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #chat-container.expanded {
            width: calc(100vw - 40px); /* Expands across the screen */
            max-width: 400px;
        }
        
        #chat-toggle {
            min-width: 45px;
            height: 45px;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            outline: none;
        }
        
        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 16px;
            padding: 0 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
            -webkit-user-select: auto;
            user-select: auto;
        }
        
        #chat-container.expanded #chat-input {
            opacity: 1;
        }
        
        #send-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 8px 12px;
            margin-right: 5px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            pointer-events: none; /* Can't click when hidden */
        }
        
        #chat-container.expanded #send-btn {
            opacity: 1;
            pointer-events: auto;
        }


        /* Shared Joystick Styles */
        #joystick-zone, #aim-zone {
            position: absolute;
            bottom: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-zone { left: 30px; }
        #aim-zone { right: 30px; } /* Anchored to the right side */

        #joystick-knob, #aim-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="chat-container">
        <button id="chat-toggle">💬</button>
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">➔</button>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="aim-zone">
        <div id="aim-knob"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Disable the right-click / long-press context menu everywhere
        window.addEventListener('contextmenu', function (e) { 
            e.preventDefault(); 
        }, false);

        // --- ZOOM LOGIC ---
        let zoomLevel = 2; 
        const MIN_ZOOM = 1;
        const MAX_ZOOM = 6;     // Increased maximum zoom
        const ZOOM_STEP = 0.5;  // Allows half-steps for finer zooming
        let initialPinchDistance = null;
        
        canvas.addEventListener('touchstart', (e) => {
            // Kills the iOS double-tap magnifier bubble instantly
            e.preventDefault(); 
            
            // Detect two fingers for pinching
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault(); // Stop the whole browser page from zooming
                
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
        
                const pinchDiff = currentDistance - initialPinchDistance;
        
                // Snap the zoom in or out if fingers moved more than 40 pixels
                if (pinchDiff > 40 && zoomLevel < MAX_ZOOM) { 
                    zoomLevel += ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                } else if (pinchDiff < -40 && zoomLevel > MIN_ZOOM) { 
                    zoomLevel -= ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                }
            }
        }, {passive: false});
        
        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });
        // Fullscreen & Retina Screen setup
        function resize() {
            // Get the pixel density of the screen (iPhones are usually 2 or 3)
            const dpr = window.devicePixelRatio || 1;
            
            // Set the visual CSS size to match the screen perfectly
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            
            // Multiply the internal canvas resolution by the pixel density to make it sharp
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            
            // Tell the canvas to scale all of our math up to match the new resolution
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // Update the player object to track movement state and current image
        const player = {
            worldX: 0,
            worldY: 0,
            speed: 4,
            vx: 0,
            vy: 0,
            message: "",
            messageTimer: 0,
            isTyping: false,
            
            // Animation variables
            frameX: 0,      
            frameY: 0,      
            tickCount: 0,   
            ticksPerFrame: 5, 
            isMoving: false,          // NEW: Tracks if we are currently walking
            currentImage: null        // NEW: Will hold either walkSprite or idleSprite
        };

        // Load BOTH sprites
        const walkSprite = new Image();
        walkSprite.src = 'walk.png'; // Added cache bust number

        const idleSprite = new Image();
        idleSprite.src = 'idle.png'; 
        
        // Set default to idle
        player.currentImage = idleSprite;

        // --- MULTIPLAYER LOGIC ---
        const otherPlayers = {};
        let myId = null;
        
        // Connect to the live cloud server
        const ws = new WebSocket('wss://my-chat-server-ihxw.onrender.com');
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'init') {
                myId = data.id;
                for (let id in data.players) {
                    if (id !== myId) {
                        otherPlayers[id] = data.players[id];
                        // Initialize target coordinates with fallbacks to prevent NaN crashes
                        otherPlayers[id].targetX = data.players[id].worldX || 0;
                        otherPlayers[id].targetY = data.players[id].worldY || 0;
                    }
                }
            } else if (data.type === 'joined' || data.type === 'update') {
                if (!otherPlayers[data.id]) {
                    // First time seeing this player
                    otherPlayers[data.id] = data.player;
                    otherPlayers[data.id].targetX = data.player.worldX;
                    otherPlayers[data.id].targetY = data.player.worldY;
                } else {
                    // Update their animations and text instantly...
                    const op = otherPlayers[data.id];
                    op.frameX = data.player.frameX;
                    op.frameY = data.player.frameY;
                    op.isMoving = data.player.isMoving;
                    op.message = data.player.message;
                    op.messageTimer = data.player.messageTimer;
                    op.isTyping = data.player.isTyping; // <-- ADD THIS LINE
                    
                    // ...but set TARGETS for their movement so we can slide them smoothly
                    op.targetX = data.player.worldX;
                    op.targetY = data.player.worldY;
                }
            } else if (data.type === 'left') {
                delete otherPlayers[data.id];
            }
        };

        // Send our state to the server ONLY when something changes
        let lastNetworkString = ""; 

        setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
                
                // 1. Create a tiny snapshot of our current state
                const currentState = {
                    x: Math.round(player.worldX), 
                    y: Math.round(player.worldY),
                    dir: player.frameY,
                    moving: player.isMoving,
                    typing: player.isTyping,
                    msg: player.message,
                    // We turn the timer into a simple true/false so it doesn't trigger an update 60 times a second while counting down!
                    isChatting: player.messageTimer > 0, 
                    frame: player.frameX
                };
                
                const currentString = JSON.stringify(currentState);

                // 2. Only send to the server if the snapshot changed!
                if (currentString !== lastNetworkString) {
                    ws.send(JSON.stringify({
                        type: 'update',
                        player: {
                            worldX: player.worldX,
                            worldY: player.worldY,
                            frameX: player.frameX,
                            frameY: player.frameY,
                            isMoving: player.isMoving,
                            message: player.message,
                            messageTimer: player.messageTimer,
                            isTyping: player.isTyping 
                        }
                    }));
                    
                    // 3. Update the memory so we don't send this exact state again
                    lastNetworkString = currentString; 
                }
            }
        }, 50);

        // --- TWIN STICK LOGIC ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const aimZone = document.getElementById('aim-zone');
        const aimKnob = document.getElementById('aim-knob');

        // A reusable function to handle moving the visual knob and calculating the math
        function processJoystick(e, zoneElement, knobElement, maxDist) {
            const rect = zoneElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // We loop through e.changedTouches instead of e.touches[0] 
            // to handle true multitouch properly
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                knobElement.style.transform = `translate(${dx}px, ${dy}px)`;
                
                // Return normalized values (-1.0 to 1.0) so you can apply them to movement or aiming
                return { x: dx / maxDist, y: dy / maxDist };
            }
        }

        // --- LEFT JOYSTICK (MOVEMENT) LISTENERS ---
        joystickZone.addEventListener('touchstart', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, joystickZone, joystickKnob, 35);
            player.vx = vectors.x * player.speed;
            player.vy = vectors.y * player.speed;
        }, {passive: false});

        joystickZone.addEventListener('touchmove', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, joystickZone, joystickKnob, 35);
            player.vx = vectors.x * player.speed;
            player.vy = vectors.y * player.speed;
        }, {passive: false});

        joystickZone.addEventListener('touchend', (e) => {
            e.stopPropagation();
            joystickKnob.style.transform = `translate(0px, 0px)`;
            player.vx = 0;
            player.vy = 0;
        });

        // --- RIGHT JOYSTICK (AIMING) LISTENERS ---
        aimZone.addEventListener('touchstart', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, aimZone, aimKnob, 35);
            // TODO: Apply vectors.x and vectors.y to your shooting/aiming logic!
        }, {passive: false});

        aimZone.addEventListener('touchmove', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, aimZone, aimKnob, 35);
            // TODO: Apply vectors.x and vectors.y to your shooting/aiming logic!
        }, {passive: false});

        aimZone.addEventListener('touchend', (e) => {
            e.stopPropagation();
            aimKnob.style.transform = `translate(0px, 0px)`;
            // TODO: Stop aiming/shooting
        });

       // --- CHAT LOGIC ---
        const chatContainer = document.getElementById('chat-container');
        const chatToggle = document.getElementById('chat-toggle');
        const chatInput = document.getElementById('chat-input');
        // Detect when the user opens/closes their keyboard
        chatInput.addEventListener('focus', () => { player.isTyping = true; });
        chatInput.addEventListener('blur', () => { player.isTyping = false; });
        const sendBtn = document.getElementById('send-btn');
        
        // Open the chat bar and trigger keyboard
        chatToggle.addEventListener('click', () => {
            chatContainer.classList.add('expanded');
            chatToggle.style.display = 'none'; // Hide the chat icon
            
            // Slight delay ensures the CSS animation starts before pulling up the keyboard
            setTimeout(() => {
                chatInput.focus(); 
            }, 100);
        });
        
        function closeChat() {
            chatInput.value = "";
            chatInput.blur(); // Hides the keyboard
            chatContainer.classList.remove('expanded');
            
            // Wait for the collapse animation before showing the icon again
            setTimeout(() => {
                chatToggle.style.display = 'block';
            }, 300);
        }
        
        function sendMessage() {
            if (chatInput.value.trim() !== "") {
                player.message = chatInput.value;
                player.messageTimer = 420;
            }
            closeChat(); // Always close after sending
        }
        
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // If the user taps the game screen while chat is open, close it
        canvas.addEventListener('touchstart', (e) => {
            if (chatContainer.classList.contains('expanded') && e.touches.length === 1) {
                // Only close if they didn't tap inside the chat box
                if (e.touches[0].clientY > 80) { 
                    closeChat();
                }
            }
        }, {passive: false});

        // --- GAME LOOP ---
       function drawGrid(offsetX, offsetY) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            
            // Scale the grid up by our zoom level
            const gridSize = 50 * zoomLevel; 
            
            // Scale the movement offset so the floor slides at the correct speed
            const scaledOffsetX = offsetX * zoomLevel;
            const scaledOffsetY = offsetY * zoomLevel;
        
            const startX = scaledOffsetX % gridSize;
            const startY = scaledOffsetY % gridSize;
        
            // Draw lines (starting slightly off-screen to prevent popping)
            for (let x = startX - gridSize; x < window.innerWidth; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, window.innerHeight); ctx.stroke();
            }
            for (let y = startY - gridSize; y < window.innerHeight; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(window.innerWidth, y); ctx.stroke();
            }
        }

        function updatePlayerDirection() {
            // Check if we are moving this frame
            const currentlyMoving = (player.vx !== 0 || player.vy !== 0);

            // If we just started or stopped moving, reset the animation frame to 0
            if (currentlyMoving !== player.isMoving) {
                player.frameX = 0;
                player.tickCount = 0;
                player.isMoving = currentlyMoving;
            }

            if (player.isMoving) {
                // WE ARE WALKING
                player.currentImage = walkSprite;
                
                // Calculate the angle to determine which row (direction) to use
                const angle = Math.atan2(player.vy, player.vx);
                const deg = angle * (180 / Math.PI); 
            
                if (deg >= 45 && deg <= 135) {
                    player.frameY = 0; // Down
                } else if (deg > 135 || deg < -150) {
                    player.frameY = 1; // Left
                } else if (deg >= -150 && deg < -105) {
                    player.frameY = 2; // Up-Left
                } else if (deg >= -105 && deg <= -75) {
                    player.frameY = 3; // Up
                } else if (deg > -75 && deg <= -30) {
                    player.frameY = 4; // Up-Right
                } else if (deg > -30 && deg < 45) {
                    player.frameY = 5; // Right
                }
            } else {
                // WE ARE IDLE
                player.currentImage = idleSprite;
                // Notice we DO NOT change player.frameY here.
                // This forces the character to stay facing the last direction they walked!
            }
        
            // Advance the animation frame for BOTH walking and idling
            player.tickCount++;
            if (player.tickCount > player.ticksPerFrame) {
                player.tickCount = 0;
                player.frameX = (player.frameX + 1) % 8; // Loop through the 8 columns
            }
        }

       // A helper function to draw perfectly scaled chat bubbles
        function drawDynamicBubble(text, timer, isTyping, x, y, scaledWidth) {
            // If they aren't chatting and aren't typing, do nothing
            if (timer <= 0 && !isTyping) return; 

            // 1. Scale the font size to be a bit smaller (changed from 14 to 12)
            const fontSize = 7 * zoomLevel;
            ctx.font = `bold ${fontSize}px Arial`;
            
            // 2. Scale the outline thickness slightly down for the smaller text
            ctx.lineJoin = "round";
            ctx.lineWidth = 2.5 * zoomLevel; 
            ctx.strokeStyle = "black";
            
            // 3. Anchor it perfectly above the head
            const bubbleY = y + (15 * zoomLevel); 
            const centerX = x + (scaledWidth / 2);
            
            if (timer > 0) {
                // --- ACTUAL CHAT MESSAGE ---
                // Keep standard messages centered
                ctx.textAlign = "center";
                
                ctx.strokeText(text, centerX, bubbleY);
                ctx.fillStyle = "white";
                ctx.fillText(text, centerX, bubbleY);
                
            } else if (isTyping) {
                // --- TYPING INDICATOR ---
                // Lock alignment to the left so the dots don't wiggle back and forth
                ctx.textAlign = "left";
                
                // Animate the dots (1 to 3)
                const dotCount = (Math.floor(Date.now() / 400) % 3) + 1;
                const displayText = ".".repeat(dotCount);
                
                // Pre-measure the maximum width of "..." so we can center the whole block
                const maxTextWidth = ctx.measureText("...").width;
                const startX = centerX - (maxTextWidth / 2);

                ctx.strokeText(displayText, startX, bubbleY);
                ctx.fillStyle = "white";
                ctx.fillText(displayText, startX, bubbleY);
            }
        }

        function update() {
            player.worldX += player.vx;
            player.worldY += player.vy;
        
            // Clear the screen using window dimensions
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            
            // THE SECRET SAUCE: Prevents pixel art from getting blurry
            ctx.imageSmoothingEnabled = false; 
            ctx.webkitImageSmoothingEnabled = false; // Forces Safari iOS to respect pixels!
        
            // Calculate center using window dimensions instead of raw canvas dimensions
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;   
        
            drawGrid(-player.worldX, -player.worldY);
            updatePlayerDirection();
            
            // 6. Calculate the size of a single frame dynamically using currentImage
            const frameWidth = player.currentImage.width / 8;
            const frameHeight = player.currentImage.height / 6;

            
            const cropX = player.frameX * frameWidth;
            const cropY = player.frameY * frameHeight;
            const scaledWidth = frameWidth * zoomLevel;
            const scaledHeight = frameHeight * zoomLevel;
            const drawX = Math.round(screenCenterX - (scaledWidth / 2));
            const drawY = Math.round(screenCenterY - (scaledHeight / 2));

            // --- DRAW OTHER PLAYERS ---
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                
                // THE LERP MAGIC: Smoothly slide actual X/Y towards target X/Y
                // 0.3 means it moves 30% of the distance to the target every frame.
                p.worldX += (p.targetX - p.worldX) * 0.3; 
                p.worldY += (p.targetY - p.worldY) * 0.3;
                
                // Calculate where they are on the screen relative to YOU
                const offsetX = p.worldX - player.worldX;
                const offsetY = p.worldY - player.worldY;
                
                const pScaledWidth = frameWidth * zoomLevel;
                const pScaledHeight = frameHeight * zoomLevel;
                
                const pDrawX = Math.round(screenCenterX + (offsetX * zoomLevel) - (pScaledWidth / 2));
                const pDrawY = Math.round(screenCenterY + (offsetY * zoomLevel) - (pScaledHeight / 2));
                
                // Choose their sprite based on if they are moving
                const pImage = p.isMoving ? walkSprite : idleSprite;
                
                // Ensure frame sizes are based on the correct sprite sheet
                const pFrameW = pImage.width / 8;
                const pFrameH = pImage.height / 6;
                const pCropX = p.frameX * pFrameW;
                const pCropY = p.frameY * pFrameH;

                ctx.drawImage(
                    pImage,
                    pCropX, pCropY, pFrameW, pFrameH,
                    pDrawX, pDrawY,
                    pScaledWidth, pScaledHeight
                );

                // Draw their chat bubble or typing indicator
                drawDynamicBubble(p.message, p.messageTimer, p.isTyping, pDrawX, pDrawY, pScaledWidth);
            }
            
            // 8. Draw the cropped frame using currentImage
            ctx.drawImage(
                player.currentImage,
                cropX, cropY, frameWidth, frameHeight,
                drawX, drawY, 
                scaledWidth, scaledHeight
            );
            
           // Draw your own chat bubble or typing indicator
            drawDynamicBubble(player.message, player.messageTimer, player.isTyping, drawX, drawY, scaledWidth);
            
            if (player.messageTimer > 0) player.messageTimer--;
        
            requestAnimationFrame(update);
        }

        // Start loop
        update();
    </script>
</body>
</html>
