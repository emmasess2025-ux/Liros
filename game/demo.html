<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overhead Chat Demo</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #222; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        
        /* Liquid Glass UI Overlay for Chat */
        #chat-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 16px;
            padding: 5px 10px;
        }

        #chat-input::placeholder { color: rgba(255,255,255,0.7); }

        #send-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Virtual Joystick Zone */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: none; /* Let the zone handle touches */
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="chat-container">
        <input type="text" id="chat-input" placeholder="Tap to chat..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Fullscreen setup
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Load the character sprite
        const playerSprite = new Image();
        // Point this to a .png file in your GitHub repository. 
        // I'm using a placeholder sprite URL here so it works immediately!
        playerSprite.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/132.png';

        // Player State
        const player = {
            worldX: 0,
            worldY: 0,
            speed: 4,
            vx: 0,
            vy: 0,
            radius: 20,
            message: "",
            messageTimer: 0
        };

        // --- JOYSTICK LOGIC ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let isDragging = false;
        let joyCenterX = 0;
        let joyCenterY = 0;

        // Get the absolute center of the joystick zone
        function updateJoystickCenter() {
            const rect = joystickZone.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
        }

        function handleTouch(e) {
            e.preventDefault(); // Stop scrolling
            if (e.touches.length === 0) return;
            
            updateJoystickCenter();
            const touch = e.touches[0];
            
            // Calculate distance and angle from center
            let dx = touch.clientX - joyCenterX;
            let dy = touch.clientY - joyCenterY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let maxDistance = 35; // How far the knob can move

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            // Move the knob visually
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            // Set player velocity based on joystick position (normalized -1 to 1)
            player.vx = (dx / maxDistance) * player.speed;
            player.vy = (dy / maxDistance) * player.speed;
        }

        joystickZone.addEventListener('touchstart', (e) => { isDragging = true; handleTouch(e); }, {passive: false});
        joystickZone.addEventListener('touchmove', (e) => { if(isDragging) handleTouch(e); }, {passive: false});
        joystickZone.addEventListener('touchend', () => {
            isDragging = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            player.vx = 0;
            player.vy = 0;
        });

        // --- CHAT LOGIC ---
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function sendMessage() {
            if (chatInput.value.trim() !== "") {
                player.message = chatInput.value;
                player.messageTimer = 180; // Show for approx 3 seconds (at 60fps)
                chatInput.value = "";
                chatInput.blur(); // Hide the keyboard
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- GAME LOOP ---
        function drawGrid(offsetX, offsetY) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            const gridSize = 50;
            
            const startX = offsetX % gridSize;
            const startY = offsetY % gridSize;

            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function update() {
            // Update world position
            player.worldX += player.vx;
            player.worldY += player.vy;

            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // The camera follows the player. So the player is always screen-center.
            const screenCenterX = canvas.width / 2;
            const screenCenterY = canvas.height / 2;

            // Draw a moving background grid to give the illusion of movement
            drawGrid(-player.worldX, -player.worldY);

            // Draw Sprite (ADD THIS BLOCK)
            const spriteWidth = 64;  // Adjust this to make your character bigger or smaller
            const spriteHeight = 64; 
            
            // We subtract half the width/height so the sprite is perfectly centered on the screen
            ctx.drawImage(
                playerSprite, 
                screenCenterX - (spriteWidth / 2), 
                screenCenterY - (spriteHeight / 2), 
                spriteWidth, 
                spriteHeight
            );

            // Draw Overhead Chat Bubble
            if (player.messageTimer > 0) {
                ctx.fillStyle = "white";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                
                // Add a small background box for the text
                const textWidth = ctx.measureText(player.message).width;
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(screenCenterX - (textWidth/2) - 10, screenCenterY - 60, textWidth + 20, 30);
                
                ctx.fillStyle = "white";
                ctx.fillText(player.message, screenCenterX, screenCenterY - 40);
                
                player.messageTimer--;
            }

            requestAnimationFrame(update);
        }

        // Start loop
        update();
    </script>
</body>
</html>
