<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overhead Chat Demo</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #222; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        
        /* Liquid Glass UI Overlay for Chat */
        #chat-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 16px;
            padding: 5px 10px;
        }

        #chat-input::placeholder { color: rgba(255,255,255,0.7); }

        #send-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Virtual Joystick Zone */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: none; /* Let the zone handle touches */
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="chat-container">
        <input type="text" id="chat-input" placeholder="Tap to chat..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- ZOOM LOGIC ---
        let zoomLevel = 2; // Start at 2x zoom
        const MIN_ZOOM = 1;
        const MAX_ZOOM = 4;
        let initialPinchDistance = null;
        
        canvas.addEventListener('touchstart', (e) => {
            // Detect two fingers for pinching
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault(); // Stop the whole browser page from zooming
                
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
        
                const pinchDiff = currentDistance - initialPinchDistance;
        
                // Snap the zoom in or out if fingers moved more than 40 pixels
                if (pinchDiff > 40 && zoomLevel < MAX_ZOOM) { 
                    zoomLevel++;
                    initialPinchDistance = currentDistance; // Reset baseline
                } else if (pinchDiff < -40 && zoomLevel > MIN_ZOOM) { 
                    zoomLevel--;
                    initialPinchDistance = currentDistance; // Reset baseline
                }
            }
        }, {passive: false});
        
        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });
        // Fullscreen setup
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const player = {
            worldX: 0,
            worldY: 0,
            speed: 4,
            vx: 0,
            vy: 0,
            message: "",
            messageTimer: 0,
            
            // Animation variables
            frameX: 0,      // Column (0 to 7)
            frameY: 0,      // Row (0 to 5, based on your list)
            tickCount: 0,   // Controls animation speed
            ticksPerFrame: 5 // Lower is faster
        };
        
        // Load your sprite
        const playerSprite = new Image();
        playerSprite.src = 'walk.png'; // Make sure this is the exact filename

        // --- JOYSTICK LOGIC ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let isDragging = false;
        let joyCenterX = 0;
        let joyCenterY = 0;

        // Get the absolute center of the joystick zone
        function updateJoystickCenter() {
            const rect = joystickZone.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
        }

        function handleTouch(e) {
            e.preventDefault(); // Stop scrolling
            if (e.touches.length === 0) return;
            
            updateJoystickCenter();
            const touch = e.touches[0];
            
            // Calculate distance and angle from center
            let dx = touch.clientX - joyCenterX;
            let dy = touch.clientY - joyCenterY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let maxDistance = 35; // How far the knob can move

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            // Move the knob visually
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            // Set player velocity based on joystick position (normalized -1 to 1)
            player.vx = (dx / maxDistance) * player.speed;
            player.vy = (dy / maxDistance) * player.speed;
        }

        joystickZone.addEventListener('touchstart', (e) => { isDragging = true; handleTouch(e); }, {passive: false});
        joystickZone.addEventListener('touchmove', (e) => { if(isDragging) handleTouch(e); }, {passive: false});
        joystickZone.addEventListener('touchend', () => {
            isDragging = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            player.vx = 0;
            player.vy = 0;
        });

        // --- CHAT LOGIC ---
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function sendMessage() {
            if (chatInput.value.trim() !== "") {
                player.message = chatInput.value;
                player.messageTimer = 180; // Show for approx 3 seconds (at 60fps)
                chatInput.value = "";
                chatInput.blur(); // Hide the keyboard
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- GAME LOOP ---
       function drawGrid(offsetX, offsetY) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            
            // Scale the grid up by our zoom level
            const gridSize = 50 * zoomLevel; 
            
            // Scale the movement offset so the floor slides at the correct speed
            const scaledOffsetX = offsetX * zoomLevel;
            const scaledOffsetY = offsetY * zoomLevel;
        
            const startX = scaledOffsetX % gridSize;
            const startY = scaledOffsetY % gridSize;
        
            // Draw lines (starting slightly off-screen to prevent popping)
            for (let x = startX - gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = startY - gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function updatePlayerDirection() {
            // If we aren't moving, reset to the standing frame (column 0) and stop
            if (player.vx === 0 && player.vy === 0) {
                player.frameX = 0;
                return; 
            }
        
            // Determine the angle of the joystick using atan2
            // This gives us a value between -PI and PI
            const angle = Math.atan2(player.vy, player.vx);
            const deg = angle * (180 / Math.PI); // Convert to degrees for easier logic
        
            // Map degrees to your 6 rows:
            // Top: Down(0), 2nd: Left(1), 3rd: Up-Left(2), 4th: Up(3), 5th: Up-Right(4), 6th: Right(5)
            
            if (deg >= 45 && deg <= 135) {
                player.frameY = 0; // Walking Down
            } else if (deg > 135 || deg < -150) {
                player.frameY = 1; // Walking Left
            } else if (deg >= -150 && deg < -105) {
                player.frameY = 2; // Walking Up-Left
            } else if (deg >= -105 && deg <= -75) {
                player.frameY = 3; // Walking Up
            } else if (deg > -75 && deg <= -30) {
                player.frameY = 4; // Walking Up-Right
            } else if (deg > -30 && deg < 45) {
                player.frameY = 5; // Walking Right
            }
        
            // Advance the animation frame
            player.tickCount++;
            if (player.tickCount > player.ticksPerFrame) {
                player.tickCount = 0;
                player.frameX = (player.frameX + 1) % 8; // Loop through the 8 columns
            }
        }

        function update() {
            player.worldX += player.vx;
            player.worldY += player.vy;
        
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // THE SECRET SAUCE: Prevents pixel art from getting blurry when scaled
            ctx.imageSmoothingEnabled = false; 
        
            const screenCenterX = canvas.width / 2;
            const screenCenterY = canvas.height / 2;
        
            drawGrid(-player.worldX, -player.worldY);
            updatePlayerDirection();
            
            const frameWidth = playerSprite.width / 8;
            const frameHeight = playerSprite.height / 6;
            const cropX = player.frameX * frameWidth;
            const cropY = player.frameY * frameHeight;
            
            // Multiply the final drawing size by our zoomLevel
            const scaledWidth = frameWidth * zoomLevel;
            const scaledHeight = frameHeight * zoomLevel;
            
            ctx.drawImage(
                playerSprite,
                cropX, cropY, frameWidth, frameHeight,
                screenCenterX - (scaledWidth / 2),
                screenCenterY - (scaledHeight / 2) - (15 * zoomLevel), 
                scaledWidth, scaledHeight
            );
        
            // Keep the chat bubble floating above the scaled character
            if (player.messageTimer > 0) {
                ctx.fillStyle = "white";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                
                const textWidth = ctx.measureText(player.message).width;
                const bubbleY = screenCenterY - (scaledHeight / 2) - (25 * zoomLevel);
                
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(screenCenterX - (textWidth/2) - 10, bubbleY - 20, textWidth + 20, 30);
                
                ctx.fillStyle = "white";
                ctx.fillText(player.message, screenCenterX, bubbleY);
                
                player.messageTimer--;
            }
        
            requestAnimationFrame(update);
        }

        // Start loop
        update();
    </script>
</body>
</html>
