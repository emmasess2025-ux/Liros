<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overhead Chat Demo</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #222; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        
       /* Expanding Chat UI */
        #chat-container {
            position: absolute;
            top: 20px;
            left: 20px; /* Moved to Top Left */
            height: 45px;
            width: 45px; /* Starts as a small circle */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1); /* Smooth snap expansion */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #chat-container.expanded {
            width: calc(100vw - 40px); /* Expands across the screen */
            max-width: 400px;
        }
        
        #chat-toggle {
            min-width: 45px;
            height: 45px;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            outline: none;
        }
        
        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 16px;
            padding: 0 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        #chat-container.expanded #chat-input {
            opacity: 1;
        }
        
        #send-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 8px 12px;
            margin-right: 5px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            pointer-events: none; /* Can't click when hidden */
        }
        
        #chat-container.expanded #send-btn {
            opacity: 1;
            pointer-events: auto;
        }


        /* Shared Joystick Styles */
        #joystick-zone, #aim-zone {
            position: absolute;
            bottom: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-zone { left: 30px; }
        #aim-zone { right: 30px; } /* Anchored to the right side */

        #joystick-knob, #aim-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="chat-container">
        <button id="chat-toggle">💬</button>
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">➔</button>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="aim-zone">
        <div id="aim-knob"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- ZOOM LOGIC ---
        let zoomLevel = 2; 
        const MIN_ZOOM = 1;
        const MAX_ZOOM = 6;     // Increased maximum zoom
        const ZOOM_STEP = 0.5;  // Allows half-steps for finer zooming
        let initialPinchDistance = null;
        
        canvas.addEventListener('touchstart', (e) => {
            // Detect two fingers for pinching
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault(); // Stop the whole browser page from zooming
                
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
        
                const pinchDiff = currentDistance - initialPinchDistance;
        
                // Snap the zoom in or out if fingers moved more than 40 pixels
                if (pinchDiff > 40 && zoomLevel < MAX_ZOOM) { 
                    zoomLevel += ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                } else if (pinchDiff < -40 && zoomLevel > MIN_ZOOM) { 
                    zoomLevel -= ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                }
            }
        }, {passive: false});
        
        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });
        // Fullscreen setup
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const player = {
            worldX: 0,
            worldY: 0,
            speed: 4,
            vx: 0,
            vy: 0,
            message: "",
            messageTimer: 0,
            
            // Animation variables
            frameX: 0,      // Column (0 to 7)
            frameY: 0,      // Row (0 to 5, based on your list)
            tickCount: 0,   // Controls animation speed
            ticksPerFrame: 5 // Lower is faster
        };
        
        // Load your sprite
        const playerSprite = new Image();
        playerSprite.src = 'walk.png'; // Make sure this is the exact filename

        // --- TWIN STICK LOGIC ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const aimZone = document.getElementById('aim-zone');
        const aimKnob = document.getElementById('aim-knob');

        // A reusable function to handle moving the visual knob and calculating the math
        function processJoystick(e, zoneElement, knobElement, maxDist) {
            const rect = zoneElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // We loop through e.changedTouches instead of e.touches[0] 
            // to handle true multitouch properly
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                knobElement.style.transform = `translate(${dx}px, ${dy}px)`;
                
                // Return normalized values (-1.0 to 1.0) so you can apply them to movement or aiming
                return { x: dx / maxDist, y: dy / maxDist };
            }
        }

        // --- LEFT JOYSTICK (MOVEMENT) LISTENERS ---
        joystickZone.addEventListener('touchstart', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, joystickZone, joystickKnob, 35);
            player.vx = vectors.x * player.speed;
            player.vy = vectors.y * player.speed;
        }, {passive: false});

        joystickZone.addEventListener('touchmove', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, joystickZone, joystickKnob, 35);
            player.vx = vectors.x * player.speed;
            player.vy = vectors.y * player.speed;
        }, {passive: false});

        joystickZone.addEventListener('touchend', (e) => {
            e.stopPropagation();
            joystickKnob.style.transform = `translate(0px, 0px)`;
            player.vx = 0;
            player.vy = 0;
        });

        // --- RIGHT JOYSTICK (AIMING) LISTENERS ---
        aimZone.addEventListener('touchstart', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, aimZone, aimKnob, 35);
            // TODO: Apply vectors.x and vectors.y to your shooting/aiming logic!
        }, {passive: false});

        aimZone.addEventListener('touchmove', (e) => { 
            e.stopPropagation(); // PREVENTS ZOOM CONFLICT
            const vectors = processJoystick(e, aimZone, aimKnob, 35);
            // TODO: Apply vectors.x and vectors.y to your shooting/aiming logic!
        }, {passive: false});

        aimZone.addEventListener('touchend', (e) => {
            e.stopPropagation();
            aimKnob.style.transform = `translate(0px, 0px)`;
            // TODO: Stop aiming/shooting
        });

       // --- CHAT LOGIC ---
        const chatContainer = document.getElementById('chat-container');
        const chatToggle = document.getElementById('chat-toggle');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        
        // Open the chat bar and trigger keyboard
        chatToggle.addEventListener('click', () => {
            chatContainer.classList.add('expanded');
            chatToggle.style.display = 'none'; // Hide the chat icon
            
            // Slight delay ensures the CSS animation starts before pulling up the keyboard
            setTimeout(() => {
                chatInput.focus(); 
            }, 100);
        });
        
        function closeChat() {
            chatInput.value = "";
            chatInput.blur(); // Hides the keyboard
            chatContainer.classList.remove('expanded');
            
            // Wait for the collapse animation before showing the icon again
            setTimeout(() => {
                chatToggle.style.display = 'block';
            }, 300);
        }
        
        function sendMessage() {
            if (chatInput.value.trim() !== "") {
                player.message = chatInput.value;
                player.messageTimer = 180;
            }
            closeChat(); // Always close after sending
        }
        
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // If the user taps the game screen while chat is open, close it
        canvas.addEventListener('touchstart', (e) => {
            if (chatContainer.classList.contains('expanded') && e.touches.length === 1) {
                // Only close if they didn't tap inside the chat box
                if (e.touches[0].clientY > 80) { 
                    closeChat();
                }
            }
        }, {passive: false});

        // --- GAME LOOP ---
       function drawGrid(offsetX, offsetY) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            
            // Scale the grid up by our zoom level
            const gridSize = 50 * zoomLevel; 
            
            // Scale the movement offset so the floor slides at the correct speed
            const scaledOffsetX = offsetX * zoomLevel;
            const scaledOffsetY = offsetY * zoomLevel;
        
            const startX = scaledOffsetX % gridSize;
            const startY = scaledOffsetY % gridSize;
        
            // Draw lines (starting slightly off-screen to prevent popping)
            for (let x = startX - gridSize; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = startY - gridSize; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function updatePlayerDirection() {
            // If we aren't moving, reset to the standing frame (column 0) and stop
            if (player.vx === 0 && player.vy === 0) {
                player.frameX = 0;
                return; 
            }
        
            // Determine the angle of the joystick using atan2
            // This gives us a value between -PI and PI
            const angle = Math.atan2(player.vy, player.vx);
            const deg = angle * (180 / Math.PI); // Convert to degrees for easier logic
        
            // Map degrees to your 6 rows:
            // Top: Down(0), 2nd: Left(1), 3rd: Up-Left(2), 4th: Up(3), 5th: Up-Right(4), 6th: Right(5)
            
            if (deg >= 45 && deg <= 135) {
                player.frameY = 0; // Walking Down
            } else if (deg > 135 || deg < -150) {
                player.frameY = 1; // Walking Left
            } else if (deg >= -150 && deg < -105) {
                player.frameY = 2; // Walking Up-Left
            } else if (deg >= -105 && deg <= -75) {
                player.frameY = 3; // Walking Up
            } else if (deg > -75 && deg <= -30) {
                player.frameY = 4; // Walking Up-Right
            } else if (deg > -30 && deg < 45) {
                player.frameY = 5; // Walking Right
            }
        
            // Advance the animation frame
            player.tickCount++;
            if (player.tickCount > player.ticksPerFrame) {
                player.tickCount = 0;
                player.frameX = (player.frameX + 1) % 8; // Loop through the 8 columns
            }
        }

        function update() {
            player.worldX += player.vx;
            player.worldY += player.vy;
        
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // THE SECRET SAUCE: Prevents pixel art from getting blurry when scaled
            ctx.imageSmoothingEnabled = false; 
        
            const screenCenterX = canvas.width / 2;
            const screenCenterY = canvas.height / 2;
        
            drawGrid(-player.worldX, -player.worldY);
            updatePlayerDirection();
            
            const frameWidth = playerSprite.width / 8;
            const frameHeight = playerSprite.height / 6;
            const cropX = player.frameX * frameWidth;
            const cropY = player.frameY * frameHeight;
            
           // Calculate final drawing sizes
            const scaledWidth = frameWidth * zoomLevel;
            const scaledHeight = frameHeight * zoomLevel;
            
            // Math.round keeps the pixel art perfectly sharp on fractional zooms
            // Notice the Y axis calculation no longer has the extra offset!
            const drawX = Math.round(screenCenterX - (scaledWidth / 2));
            const drawY = Math.round(screenCenterY - (scaledHeight / 2));
            
            ctx.drawImage(
                playerSprite,
                cropX, cropY, frameWidth, frameHeight,
                drawX, drawY, 
                scaledWidth, scaledHeight
            );
            
            // Keep the chat bubble floating above the newly centered character
            if (player.messageTimer > 0) {
                ctx.fillStyle = "white";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                
                const textWidth = ctx.measureText(player.message).width;
                const bubbleY = drawY - 20; // Anchor it just above the sprite's head
                
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(screenCenterX - (textWidth/2) - 10, bubbleY - 20, textWidth + 20, 30);
                
                ctx.fillStyle = "white";
                ctx.fillText(player.message, screenCenterX, bubbleY);
                
                player.messageTimer--;
            }
        
            requestAnimationFrame(update);
        }

        // Start loop
        update();
    </script>
</body>
</html>
