<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overhead Chat Demo</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #222; 
            touch-action: none; 
            font-family: sans-serif; 
            
            /* Stops Safari/Chrome from highlighting elements */
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            -moz-user-select: none;      
            -ms-user-select: none;       
            user-select: none;           
        }        

        /* Universal iOS Lockdown */
        * {
            -webkit-tap-highlight-color: transparent; /* Kills the grey flash when tapping */
        }
        
        canvas { display: block; 
                    touch-action: none; /* Double-secures no native zooming */ }
        
       /* Expanding Chat UI */
        #chat-container {
            position: absolute;
            top: 20px;
            left: 20px; 
            height: 45px;
            width: 45px; /* Starts as a dark square */
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        #chat-container.expanded {
            width: calc(100vw - 40px); /* Expands across the screen */
            max-width: 400px;
        }
        
        #chat-toggle {
            min-width: 45px;
            height: 45px;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            outline: none;
        }
        
        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 16px;
            padding: 0 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
            -webkit-user-select: auto;
            user-select: auto;
        }
        
        #chat-container.expanded #chat-input {
            opacity: 1;
        }
        
        #send-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 8px 12px;
            margin-right: 5px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            pointer-events: none; /* Can't click when hidden */
        }
        
        #chat-container.expanded #send-btn {
            opacity: 1;
            pointer-events: auto;
        }


        /* Shared Joystick Styles */
        #joystick-zone, #aim-zone {
            position: absolute;
            bottom: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #joystick-zone { left: 30px; }
        #aim-zone { right: 30px; } /* Anchored to the right side */

        #joystick-knob, #aim-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: none;
        }

        /* --- AUTH SCREEN STYLES --- */
        #auth-overlay {
            display: none; /* Start hidden, will be shown when server connects */
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); /* Darkens the game behind it */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Forces it above everything else */
            transition: opacity 0.3s ease;
        }

        #auth-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #auth-box input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 16px;
            outline: none;
            border: 1px solid transparent;
        }

        #auth-box input:focus { border: 1px solid rgba(255,255,255,0.5); }

        .auth-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }

        .auth-btn:active { background: rgba(255, 255, 255, 0.5); }

        #auth-message {
            color: #ff6b6b; /* Soft red for errors */
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }

        #menu-toggle {
            position: absolute;
            top: 75px; 
            left: 20px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- APP TRAY STYLES (SIDEWAYS POP) --- */
        #app-tray {
            position: absolute;
            top: 75px;  /* Aligns perfectly with the top of the gear/toggle button */
            left: 75px; /* Pushes it to the right of the button */
            width: 160px; /* Wide enough for the 2x2 grid */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px; 
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 15px;
            opacity: 0;
            pointer-events: none;
            
            /* The Sideways Spring Animation */
            transform-origin: left top; /* Makes it grow outward from the button */
            transform: scale(0.8) translateX(-20px); /* Starts smaller and tucked behind the button */
            transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1.2), transform 0.3s cubic-bezier(0.25, 1, 0.5, 1.2);
            z-index: 99;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #app-tray.open {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateX(0); /* Slides and scales into its natural place */
        }

        /* Individual App Icons */
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-bg {
            width: 50px;
            height: 50px;
            border-radius: 14px; /* The classic iOS app curve */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, filter 0.1s;
        }

        /* The squish effect when you physically tap an app */
        .app-icon:active .app-bg {
            transform: scale(0.85); 
            filter: brightness(0.8);
        }

        .app-icon span {
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* --- TILE PALETTE STYLES ---*/
        #tile-palette {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: none; /* Hidden by default */
            flex-direction: column;
            z-index: 1000;
        }

        #palette-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        #tile-grid {
            flex: 1;
            overflow: auto; /* Allows infinite scrolling horizontally and vertically */
            padding: 10px;
        }

        .palette-tile {
            width: 24px; /* Fixed size so they are easy to tap on mobile */
            height: 24px;
            cursor: pointer;
            image-rendering: pixelated; 
            box-sizing: border-box;
        }

        .palette-tile.selected {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
            position: relative;
            z-index: 2; /* Makes the highlight pop over other tiles */
        }

        /* --- PALETTE RESIZER --- */
        #palette-resizer {
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 100%;
            cursor: ew-resize; /* Shows the left-right stretch cursor */
            background: rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none; /* Crucial so dragging it doesn't accidentally scroll */
        }

        #palette-resizer::after {
            content: "⋮";
            color: white;
            font-size: 20px;
            opacity: 0.5;
        }

        /* --- TILE INSPECTOR STYLES --- */    
        #tile-inspector {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            width: 120px;
            display: none; /* Hidden by default */
            flex-direction: column;
            z-index: 1001;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* Inspector Buttons */
        .layer-btn {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer;
            font-size: 12px; font-weight: bold; flex: 1;
        }
        .layer-btn.active {
            background: #f1c40f; color: black; border-color: white;
        }
        .tool-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
        }
        .tool-btn.active { background: #3498db; border-color: white; }

        /* --- FLOATING EDITOR TOOLBAR --- */
        #editor-toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%); 
            width: 95vw; /* Made slightly wider to give more breathing room */
            max-width: 600px;
            height: 45px; /* SHRUNK from 55px */
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px; /* Slightly tighter corners */
            display: flex; 
            align-items: center;
            z-index: 1002;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            padding: 0 5px;
            box-sizing: border-box;
        }

        #toolbar-drag-handle {
            color: rgba(255,255,255,0.4);
            font-size: 18px; /* SHRUNK */
            padding: 0 5px; /* SHRUNK */
            cursor: grab;
            touch-action: none; 
            display: flex;
            align-items: center;
        }

        #toolbar-controls {
            display: flex;
            flex: 1;
            gap: 4px; /* SHRUNK gap between buttons */
            overflow-x: auto; 
            align-items: center;
            height: 100%;
            padding: 0 5px;
            scrollbar-width: none; 
        }
        #toolbar-controls::-webkit-scrollbar { display: none; } 

        .toolbar-divider {
            width: 2px;
            height: 24px; /* SHRUNK */
            background: rgba(255,255,255,0.15);
            margin: 0 2px;
            flex-shrink: 0;
            border-radius: 2px;
        }

        /* THE COMPACT BUTTON STYLES */
        #editor-toolbar .tool-btn, #editor-toolbar .layer-btn {
            flex-shrink: 0; 
            white-space: nowrap;
            padding: 6px 8px; /* SHRUNK padding */
            font-size: 11px;  /* SHRUNK font size */
            border-radius: 8px;
        }

        /* --- MAP BUTTON & MODAL --- */
        #map-toggle {
            position: absolute;
            top: 130px; 
            left: 20px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #map-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex; 
            justify-content: center;
            align-items: center;
            z-index: 2000; /* Forces it above the edit tray */
        }

        #map-container {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #minimap-canvas {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            image-rendering: pixelated; /* Keeps tiles sharp when shrunk */
        }

        /* Mini-Map Overlay Buttons */
        .map-ctrl-btn {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .map-ctrl-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

<div id="auth-overlay">
        <div id="auth-box">
            <button id="close-auth-btn" style="float: right; background: none; border: none; color: white; font-size: 20px; cursor: pointer;">✖</button>
            
            <div id="auth-login-view">
                <h2 style="margin-top: 0; font-family: sans-serif;">Welcome</h2>
                <div id="auth-message"></div>
                
                <input type="email" id="auth-email" placeholder="Email Address" autocomplete="off">
                <input type="text" id="auth-username" placeholder="Display Name (For Sign Up)">
                <input type="password" id="auth-password" placeholder="Password">
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="login-btn" class="auth-btn">Log In</button>
                    <button id="register-btn" class="auth-btn" style="background: rgba(255,255,255,0.1);">Sign Up</button>
                </div>
            </div>

            <div id="auth-signout-view" style="display: none;">
                <h2 style="margin-top: 0; font-family: sans-serif;">Sign Out</h2>
                <p style="color: white; font-size: 15px; margin-bottom: 20px;">Are you sure you want to sign out? Your location will be saved securely.</p>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="confirm-signout-btn" class="auth-btn" style="background: rgba(255, 107, 107, 0.5);">Yes, Sign Out</button>
                    <button id="cancel-signout-btn" class="auth-btn" style="background: rgba(255,255,255,0.1);">Cancel</button>
                </div>
            </div>

        </div>
    </div>

    <div id="chat-container">
        <button id="chat-toggle">💬</button>
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">➔</button>
    </div>

    <div id="notif-btn-container" style="display: none; position: absolute; top: 20px; left: 75px; width: 45px; height: 45px; z-index: 100;">
        <button id="notif-toggle" style="width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 12px; cursor: pointer; padding: 0; overflow: hidden; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <canvas id="notif-canvas" width="45" height="45" style="image-rendering: pixelated;"></canvas>
        </button>
        <div id="notif-badge" style="position: absolute; top: -5px; right: -5px; background: #ff3b30; color: white; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #222;">1</div>
    </div>

    <div id="notif-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); justify-content: center; align-items: center; z-index: 2000;">
        <div style="width: 320px; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 20px; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;">
            
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                <div style="width: 45px; height: 45px; background: rgba(0,0,0,0.4); border-radius: 8px; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
                    <canvas id="modal-avatar-canvas" width="45" height="45" style="image-rendering: pixelated;"></canvas>
                </div>
                <h3 style="margin: 0; font-family: sans-serif; font-size: 16px; color: #f1c40f;">Private Message</h3>
            </div>

            <p id="notif-text" style="font-size: 14px; margin-top: 0; margin-bottom: 25px; font-family: sans-serif; line-height: 1.5; color: #eee;"></p>
            
            <div style="display: flex; gap: 10px;">
                <button id="notif-yes-btn" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-weight: bold; cursor: pointer;">Yes</button>
                <button id="notif-no-btn" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-weight: bold; cursor: pointer;">No</button>
            </div>
        </div>
    </div>

    <button id="menu-toggle" style="font-size: 20px;">📱</button>
    
    <div id="app-tray">
        <div class="app-icon" id="app-auth">
            <div class="app-bg" style="background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);">🔑</div>
            <span>Log In</span>
        </div>
        
        <div class="app-icon" id="app-inventory">
            <div class="app-bg" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">🎒</div>
            <span>Bag</span>
        </div>

        <div class="app-icon" id="app-friends">
            <div class="app-bg" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">👥</div>
            <span>Friends</span>
        </div>

        <div class="app-icon" id="app-house">
            <div class="app-bg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">🏠</div>
            <span>House</span>
        </div>

        <div class="app-icon" id="app-edit-mode">
            <div class="app-bg" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">🎨</div>
            <span>Edit Mode</span>
        </div>
    </div>

    <button id="map-toggle" style="font-size: 20px;">🗺️</button>

    <div id="map-modal" style="display: none;">
        <div id="map-container" style="position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0; color: white; font-family: sans-serif;">World Map</h3>
                <button id="close-map" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">✖</button>
            </div>
            
            <div id="map-player-count" style="position: absolute; top: 50px; left: 30px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; font-family: sans-serif; border: 1px solid rgba(255,255,255,0.2); pointer-events: none;">
                Players: 1
            </div>

            <div style="position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 8px;">
                <button id="map-recenter" class="map-ctrl-btn">🎯</button>
                <button id="map-zoom-in" class="map-ctrl-btn">➕</button>
                <button id="map-zoom-out" class="map-ctrl-btn">➖</button>
            </div>

            <canvas id="minimap-canvas" width="500" height="300"></canvas>
        </div>
    </div>

    <div id="profile-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); justify-content: center; align-items: center; z-index: 2000;">
        <div style="width: 500px; height: 300px; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; display: flex; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <button id="close-profile" style="position: absolute; top: 10px; right: 15px; background: none; border: none; color: white; font-size: 20px; cursor: pointer; z-index: 10;">✖</button>

            <div style="width: 45%; background: rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; border-right: 1px solid rgba(255,255,255,0.1);">
                <canvas id="profile-canvas" width="150" height="200" style="image-rendering: pixelated;"></canvas>
            </div>

            <div style="width: 55%; padding: 30px; display: flex; flex-direction: column; justify-content: center;">
                <h2 id="profile-name-display" style="color: white; margin: 0 0 5px 0; font-family: sans-serif; font-size: 28px;">Username</h2>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const tilesetImage = new Image();
        tilesetImage.src = 'All_Tilesets.png';
        
        let editMode = false;
        let selectedTileId = 0;
        const TILE_SIZE = 16; // Your tileset looks like a 16px grid
        const worldMap = {};  // Stores "x,y": tileId

        // Disable the right-click / long-press context menu everywhere
        window.addEventListener('contextmenu', function (e) { 
            e.preventDefault(); 
        }, false);

        // --- ZOOM LOGIC ---
        let zoomLevel = 2; 
        const MIN_ZOOM = 1;
        const MAX_ZOOM = 6;     // Increased maximum zoom
        const ZOOM_STEP = 0.5;  // Allows half-steps for finer zooming
        let initialPinchDistance = null;
        
        canvas.addEventListener('touchstart', (e) => {
            // Kills the iOS double-tap magnifier bubble instantly
            e.preventDefault(); 
            
            // Detect two fingers for pinching
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault(); // Stop the whole browser page from zooming
                
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
        
                const pinchDiff = currentDistance - initialPinchDistance;
        
                // Snap the zoom in or out if fingers moved more than 40 pixels
                if (pinchDiff > 40 && zoomLevel < MAX_ZOOM) { 
                    zoomLevel += ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                } else if (pinchDiff < -40 && zoomLevel > MIN_ZOOM) { 
                    zoomLevel -= ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                }
            }
        }, {passive: false});
        
        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });
        // Fullscreen & Retina Screen setup
        function resize() {
            // Get the pixel density of the screen (iPhones are usually 2 or 3)
            const dpr = window.devicePixelRatio || 1;
            
            // Set the visual CSS size to match the screen perfectly
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            
            // Multiply the internal canvas resolution by the pixel density to make it sharp
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            
            // Tell the canvas to scale all of our math up to match the new resolution
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const player = {    
            worldX: 0,
            worldY: 0,
            speed: 4,
            vx: 0,
            vy: 0,
            message: "",
            messageTimer: 0,
            isTyping: false,
            
            frameX: 0,      
            frameY: 0,      
            tickCount: 0,   
            ticksPerFrame: 5, 
            isMoving: false,          
            currentImage: null,
            
            hotbar: ["none", "none", "none"], 
            activeSlot: 0,                    
            equippedWeapon: "none",

            // --- THE FIX: Give guests an inventory so the bag doesn't crash! ---
            inventory: ["ghost_gun"], 

            // --- NUEVOS STATS DE COMBATE ---
            hp: 100,
            maxHp: 100,
            ammo: 0,
            isReloading: false,
            lastShotX: 0, 
            lastShotY: 0,
            lastHitTime: 0, // <--- ¡NUEVO!
            isDead: false // <--- ¡NUEVO ESTADO!
        };

        // --- NEW: PROJECTILE DATA & WEAPONS DB ---
        let WEAPONS = {}; // ¡El servidor llenará esto mágicamente al conectar!
        let projectiles = [];
        let damageTexts = []; // <--- ¡NUEVO: Arreglo para los números de daño flotantes!
        let isShooting = false;
        let shootAngle = 0;
        let lastShotTime = 0;
        // (Borramos el FIRE_RATE fijo, ahora viene de la tabla WEAPONS)

        const walkSprite = new Image();
        walkSprite.src = 'walk.png'; 

        const idleSprite = new Image();
        idleSprite.src = 'idle.png'; 
        
        // --- NEW: WEAPON & AIMING SPRITES ---
        const walkAimSprite = new Image();
        walkAimSprite.src = 'Walk_while_aim.png';

        const ghostGunSprite = new Image();
        ghostGunSprite.src = 'Ghost_gun.png';
        
        // Add equipped weapon to local player state
        player.equippedWeapon = "none";
        
        // Set default to idle
        player.currentImage = idleSprite;

        // --- MULTIPLAYER LOGIC ---
        const otherPlayers = {};
        let myId = null;

        // Auth UI Elements
        const authOverlay = document.getElementById('auth-overlay');
        const authEmail = document.getElementById('auth-email'); // <--- NEW: Grab the email box
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const authMessage = document.getElementById('auth-message');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');

        // UI Elements
        const menuToggle = document.getElementById('menu-toggle');
        const appTray = document.getElementById('app-tray');
        const appAuth = document.getElementById('app-auth'); // The Login App Icon
        const closeAuthBtn = document.getElementById('close-auth-btn'); // The X on the card
        let isLoggedIn = false; // Tracks if we should log in or log out
        const authLoginView = document.getElementById('auth-login-view');
        const authSignoutView = document.getElementById('auth-signout-view');
        const confirmSignoutBtn = document.getElementById('confirm-signout-btn');
        const cancelSignoutBtn = document.getElementById('cancel-signout-btn');

        // 1. Toggle the iOS app tray (Slides out sideways)
        menuToggle.addEventListener('click', () => {
            appTray.classList.toggle('open');
        });

        // 2. Click the Login App -> Opens Card, Chooses View
        appAuth.addEventListener('click', () => {
            // Sledgehammer force the glass card to open
            authOverlay.style.display = 'flex';       
            authOverlay.style.opacity = '1';          
            authOverlay.style.pointerEvents = 'auto'; 
            appTray.classList.remove('open');         

            // Decide which text to show inside the card!
            if (!isLoggedIn) {
                authLoginView.style.display = 'block';
                authSignoutView.style.display = 'none';
            } else {
                authLoginView.style.display = 'none';
                authSignoutView.style.display = 'block';
            }
        });

        // --- Sign Out Confirmation Buttons ---
        confirmSignoutBtn.addEventListener('click', () => {
            // FIX: Destroy the correct token name!
            localStorage.removeItem('gameToken');
            
            // Refresh the page to drop back in as a Guest
            window.location.reload(); 
        });

        cancelSignoutBtn.addEventListener('click', () => {
            // They changed their mind. Just close the glass card!
            authOverlay.style.display = 'none';
            authOverlay.style.opacity = '0';
            authOverlay.style.pointerEvents = 'none';
        });

        // 3. Close Auth screen if they click the 'X'
        closeAuthBtn.addEventListener('click', () => {
            authOverlay.style.display = 'none';
            authOverlay.style.opacity = '0';
            authOverlay.style.pointerEvents = 'none';
        });
        
        // (Optional but nice) Close the app tray if they click the canvas
        canvas.addEventListener('touchstart', (e) => {
            if (appTray.classList.contains('open') && e.touches.length === 1) {
                appTray.classList.remove('open');
            }
        }, {passive: false});
        

        // Connect to the live cloud server
        const ws = new WebSocket('wss://my-chat-server-ihxw.onrender.com');

        // Connect locally for testing the database
        //const ws = new WebSocket('ws://localhost:8080');

        // --- WEBSOCKET CONNECTION STATE ---
        authMessage.style.color = '#f1c40f'; // Yellow
        authMessage.innerText = "Connecting to server...";
        
        ws.onopen = () => { 
            authMessage.style.color = 'white';
            authMessage.innerText = "Server connected! Please log in.";

            // Check if we have a saved session token!
            const savedToken = localStorage.getItem('gameToken');
            if (savedToken) {
                authMessage.style.color = '#f1c40f';
                authMessage.innerText = "Resuming session...";
                ws.send(JSON.stringify({ type: 'auto_login', token: savedToken }));
            } else {
                authMessage.innerText = ""; // Clear the "connecting" message
            }   
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // --- NEW: AUTHENTICATION RESPONSES ---
            if (data.type === 'auth_error') {
                authMessage.style.color = '#ff6b6b'; // Red
                authMessage.innerText = data.message;
            } else if (data.type === 'register_success') {
                authMessage.style.color = '#4cd137'; // Green
                authMessage.innerText = data.message;
            }

// --- EXISTING: GAME INITIALIZATION ---
            else if (data.type === 'init') {
                authOverlay.style.pointerEvents = 'none';
                authOverlay.style.opacity = '0'; 
                // --- NUEVO: GUARDAR LA DB DE ARMAS ---
                WEAPONS = data.weaponsDB;
                
                myId = data.id;
                player.worldX = data.players[myId].worldX;
                player.worldY = data.players[myId].worldY;
                player.username = data.players[myId].username;

                for (let id in data.players) {
                    if (id !== myId) {
                        otherPlayers[id] = data.players[id];
                        otherPlayers[id].targetX = data.players[id].worldX || 0;
                        otherPlayers[id].targetY = data.players[id].worldY || 0;
                    }
                }
                
                // 🔄 NEW: Store tiles as objects with layer and collision data!
                if (data.worldMap) {
                    data.worldMap.forEach(t => {
                        const l = t.l || 0;
                        worldMap[`${t.x},${t.y},${l}`] = { 
                            tileId: t.tileId, l: l, hasCollision: t.hasCollision || false 
                        };
                    });
                }
            } 
            else if (data.type === 'tile_update') {
               if (data.tileId === -1) {
                        delete worldMap[`${data.x},${data.y},${data.l}`]; 
                    } else {
                        const existing = worldMap[`${data.x},${data.y},${data.l}`] || { hasCollision: false };
                        worldMap[`${data.x},${data.y},${data.l}`] = { 
                            tileId: data.tileId, l: data.l, hasCollision: existing.hasCollision 
                        };
                    }
            }
            else if (data.type === 'tile_meta_update') {
                // Someone changed a tile using the Inspector
                if (worldMap[`${data.x},${data.y}`]) {
                    worldMap[`${data.x},${data.y}`].layer = data.layer;
                    worldMap[`${data.x},${data.y}`].hasCollision = data.hasCollision;
                    worldMap[`${data.x},${data.y}`].overlayTileId = data.overlayTileId; // <--- NEW
                }
            }// --- NEW: RECEIVE BULLET FROM ANOTHER PLAYER ---
            else if (data.type === 'shoot') {
                spawnProjectile(data.x, data.y, data.angle, data.id, data.weaponId);
            }
            // --- NEW: RECIBIR ACTUALIZACIÓN DE VIDA DESDE EL SERVIDOR ---
            else if (data.type === 'hp_update') {
                if (data.targetId === myId) {
                    player.hp = data.newHp;
                    player.isDead = data.isDead; // <--- GUARDAR ESTADO
                    player.lastHitTime = Date.now(); 
                    if (data.damageDealt > 0) spawnDamageText(player.worldX, player.worldY, data.damageDealt);
                } else if (otherPlayers[data.targetId]) {
                    otherPlayers[data.targetId].hp = data.newHp;
                    otherPlayers[data.targetId].isDead = data.isDead; // <--- GUARDAR ESTADO
                    otherPlayers[data.targetId].lastHitTime = Date.now();
                    if (data.damageDealt > 0) spawnDamageText(otherPlayers[data.targetId].worldX, otherPlayers[data.targetId].worldY, data.damageDealt);
                }
            }
            else if (data.type === 'joined' || data.type === 'update') {
                // Ignore messages about our own character!
                if (data.id === myId) return; 
                
                if (!otherPlayers[data.id]) {
                    // First time seeing this player
                    otherPlayers[data.id] = data.player;
                    otherPlayers[data.id].targetX = data.player.worldX;
                    otherPlayers[data.id].targetY = data.player.worldY;
                } else {
                    // Update their animations and text instantly...
                    const op = otherPlayers[data.id];
                    
                    // --- THE FIX: ALWAYS UPDATE THEIR USERNAME! ---
                    op.username = data.player.username; 
                    
                    op.frameX = data.player.frameX;
                    op.frameY = data.player.frameY;
                    op.isMoving = data.player.isMoving;
                    op.message = data.player.message;
                    op.messageTimer = data.player.messageTimer;
                    op.isTyping = data.player.isTyping; 

                    // --- THE FIX: CATCH THEIR WEAPON STATE ---
                    op.equippedWeapon = data.player.equippedWeapon;
                    op.isDead = data.player.isDead;

                    // ...but set TARGETS for their movement so we can slide them smoothly
                    op.targetX = data.player.worldX;
                    op.targetY = data.player.worldY;
                }
            } else if (data.type === 'left') {
                delete otherPlayers[data.id];
            } else if (data.type === 'login_success') {
                // SLEDGEHAMMER HIDE THE LOGIN SCREEN
                authOverlay.style.display = 'none';
                authOverlay.style.opacity = '0';
                authOverlay.style.pointerEvents = 'none';
                
                // SAVE THE TOKEN TO BROWSER MEMORY!
                if (data.token) {
                    localStorage.setItem('gameToken', data.token);
                }
                // --- THE FIX: Load the friends array from the server into your local player! ---
                player.friends = data.friends || [];

                // --- THE FIX: Load the inventory from the server! ---
                player.inventory = data.player.inventory || [];
                // --- THE PERSISTENCE FIX: Apply the loaded weapon! ---
                player.equippedWeapon = data.player.equippedWeapon || "none";
                
                // --- THE HOTBAR PERSISTENCE FIX ---
                player.hotbar = data.player.hotbar || ["none", "none", "none"]; 
                
                // Set the active highlight to match the equipped weapon
                const slotIndex = player.hotbar.indexOf(player.equippedWeapon);
                if (slotIndex !== -1) {
                    player.activeSlot = slotIndex;
                }

                // Redraw the HUD so it shows your saved items!
                renderHudHotbar();

                // MORPH THE TRAY BUTTON INTO "SIGN OUT"
                isLoggedIn = true;
                const authBg = appAuth.querySelector('.app-bg');
                const authText = appAuth.querySelector('span');
                
                authBg.innerText = '🚪'; 
                authBg.style.background = 'linear-gradient(135deg, #ff0844 0%, #ffb199 100%)'; // Red logout gradient
                authText.innerText = 'Sign Out';
                
                // Update our local character with the DB memory
                player.username = data.player.username;
                player.worldX = data.player.worldX;
                player.worldY = data.player.worldY;
                
                // Force an immediate camera update
                lastNetworkString = ""; 
            }// --- NEW: RECEIVE A FRIEND REQUEST ---
            else if (data.type === 'friend_request') {
                // Only react if the request is actually for YOU!
                if (data.targetUsername === player.username) {
                    pendingRequests.push(data);
                    
                    // Show the button and update the red badge number
                    notifBtnContainer.style.display = 'block';
                    notifBadge.innerText = pendingRequests.length;

                    // Paint their upper-body onto the button!
                    if (nCtx) {
                        nCtx.clearRect(0, 0, notifCanvas.width, notifCanvas.height);
                        const pFrameW = idleSprite.width / 8; 
                        const pFrameH = idleSprite.height / 6;
                        
                        // Crop to their upper half
                        const cropW = pFrameW;
                        const cropH = pFrameH / 2; 
                        const cropX = data.senderFrameX * pFrameW;
                        const cropY = data.senderFrameY * pFrameH;
                        
                        // Scale it up nicely to fit the 45x45 circle
                        const drawW = 32;
                        const drawH = 32 * (cropH / cropW);
                        
                        nCtx.drawImage(
                            idleSprite, 
                            cropX, cropY, cropW, cropH,
                            (notifCanvas.width - drawW) / 2, (notifCanvas.height - drawH) / 2 + 3, 
                            drawW, drawH
                        );
                    }
                }
            }
        };

        // --- UPDATED LOGIN BUTTON ---
        loginBtn.addEventListener('click', () => {
            if (ws.readyState !== WebSocket.OPEN) {
                authMessage.style.color = '#f1c40f';
                authMessage.innerText = "Still connecting... please wait.";
                return;
            }
            
            if (authEmail.value && authPassword.value) {
                ws.send(JSON.stringify({
                    type: 'login',
                    email: authEmail.value.trim().toLowerCase(), // Send email instead of username
                    password: authPassword.value
                }));
            } else {
                authMessage.innerText = "Please enter your email and password.";
            }
        });

        // --- UPDATED REGISTER BUTTON ---
        registerBtn.addEventListener('click', () => {
            if (ws.readyState !== WebSocket.OPEN) {
                authMessage.style.color = '#f1c40f';
                authMessage.innerText = "Still connecting... please wait.";
                return;
            }

        // A reusable function to handle moving the visual knob and calculating the math
        function processJoystick(e, zoneElement, knobElement, maxDist) {
            const rect = zoneElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // We loop through e.changedTouches instead of e.touches[0] 
            // to handle true multitouch properly
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                knobElement.style.transform = `translate(${dx}px, ${dy}px)`;
                
                // Return normalized values (-1.0 to 1.0) so you can apply them to movement or aiming
                return { x: dx / maxDist, y: dy / maxDist };
            }
        }

       function drawGrid(offsetX, offsetY) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            
            // Scale the grid up by our zoom level
            const gridSize = 50 * zoomLevel; 
            
            // Scale the movement offset so the floor slides at the correct speed
            const scaledOffsetX = offsetX * zoomLevel;
            const scaledOffsetY = offsetY * zoomLevel;
        
            const startX = scaledOffsetX % gridSize;
            const startY = scaledOffsetY % gridSize;
        
            // Draw lines (starting slightly off-screen to prevent popping)
            for (let x = startX - gridSize; x < window.innerWidth; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, window.innerHeight); ctx.stroke();
            }
            for (let y = startY - gridSize; y < window.innerHeight; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(window.innerWidth, y); ctx.stroke();
            }
        }

        function updatePlayerDirection() {
            const currentlyMoving = (player.vx !== 0 || player.vy !== 0);

            if (currentlyMoving !== player.isMoving) {
                player.frameX = 0; player.tickCount = 0; player.isMoving = currentlyMoving;
            }

            // --- EL FIX TÁCTICO: EL JOYSTICK DERECHO CONTROLA LA MIRADA ---
            let faceAngle;
            
            // Si está disparando, fuerza al cuerpo a mirar hacia el ángulo de la bala
            if (isShooting && player.equippedWeapon === "ghost_gun") {
                faceAngle = shootAngle;
            } 
            // Si NO está disparando pero se mueve, mira hacia donde camina
            else if (player.isMoving) {
                faceAngle = Math.atan2(player.vy, player.vx);
            }

            // Solo actualizamos la dirección visual si hay un ángulo activo
            if (faceAngle !== undefined) {
                const deg = faceAngle * (180 / Math.PI); 

                if (player.equippedWeapon === "ghost_gun") {
                    player.currentImage = walkAimSprite;
                    if (deg > 45 && deg <= 135) player.frameY = 0;      // Down
                    else if (deg > -45 && deg <= 45) player.frameY = 1; // Right
                    else if (deg > 135 || deg <= -135) player.frameY = 2; // Left
                    else if (deg > -135 && deg <= -45) player.frameY = 3; // Up
                } else {
                    player.currentImage = walkSprite;
                    if (deg >= 45 && deg <= 135) player.frameY = 0; // Down
                    else if (deg > 135 || deg < -150) player.frameY = 1; // Left
                    else if (deg >= -150 && deg < -105) player.frameY = 2; // Up-Left
                    else if (deg >= -105 && deg <= -75) player.frameY = 3; // Up
                    else if (deg > -75 && deg <= -30) player.frameY = 4; // Up-Right
                    else if (deg > -30 && deg < 45) player.frameY = 5; // Right
                }
            }
                
            // --- AVANCE DE LA ANIMACIÓN (PIERNAS) ---
            if (player.isMoving) {
                player.tickCount++;
                if (player.tickCount > player.ticksPerFrame) {
                    player.tickCount = 0;
                    player.frameX = (player.frameX + 1) % 8; 
                }
            } else {
                if (player.equippedWeapon === "ghost_gun") {
                    player.currentImage = walkAimSprite;
                    // Congela en el frame estático
                    if (player.frameY === 0) player.frameX = 7;      
                    else if (player.frameY === 1) player.frameX = 0; 
                    else if (player.frameY === 2) player.frameX = 0; 
                    else if (player.frameY === 3) player.frameX = 0; 
                } else {
                    player.currentImage = idleSprite;
                    player.tickCount++;
                    if (player.tickCount > player.ticksPerFrame) {
                        player.tickCount = 0;
                        player.frameX = (player.frameX + 1) % 8; 
                    }
                }
            }
        }

       // A helper function to draw perfectly scaled chat bubbles
        function drawDynamicBubble(text, timer, isTyping, x, y, scaledWidth) {
            // If they aren't chatting and aren't typing, do nothing
            if (timer <= 0 && !isTyping) return; 

            // 1. Scale the font size to be a bit smaller (changed from 14 to 12)
            const fontSize = 7 * zoomLevel;
            ctx.font = `bold ${fontSize}px Arial`;
            
            // 2. Scale the outline thickness slightly down for the smaller text
            ctx.lineJoin = "round";
            ctx.lineWidth = 2.5 * zoomLevel; 
            ctx.strokeStyle = "black";
            
            // 3. Anchor it perfectly above the head
            const bubbleY = y + (15 * zoomLevel); 
            const centerX = x + (scaledWidth / 2);
            
            if (timer > 0) {
                // --- ACTUAL CHAT MESSAGE ---
                // Keep standard messages centered
                ctx.textAlign = "center";
                
                ctx.strokeText(text, centerX, bubbleY);
                ctx.fillStyle = "white";
                ctx.fillText(text, centerX, bubbleY);
                
            } else if (isTyping) {
                // --- TYPING INDICATOR ---
                // Lock alignment to the left so the dots don't wiggle back and forth
                ctx.textAlign = "left";
                
                // Animate the dots (1 to 3)
                const dotCount = (Math.floor(Date.now() / 400) % 3) + 1;
                const displayText = ".".repeat(dotCount);
                
                // Pre-measure the maximum width of "..." so we can center the whole block
                const maxTextWidth = ctx.measureText("...").width;
                const startX = centerX - (maxTextWidth / 2);

                ctx.strokeText(displayText, startX, bubbleY);
                ctx.fillStyle = "white";
                ctx.fillText(displayText, startX, bubbleY);
            }
        }

        // --- NEW: Helper to pick a consistent color based on a player's name ---
        function getColorForString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 80%, 65%)`; // Returns a nice, bright, readable color!
        }

        function drawNametag(name, x, y, scaledWidth, scaledHeight, textColor) {
            if (!name) return;

            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = "center";
            
            // THE GAP FIX: Changed from (12 * zoomLevel) to (3 * zoomLevel)
            const tagY = y + scaledHeight + (-12 * zoomLevel); 
            const centerX = x + (scaledWidth / 2);
            
            // Set transparency to 70%
            ctx.globalAlpha = 0.5; 
            
            ctx.lineJoin = "round";
            ctx.lineWidth = 2.5 * zoomLevel;
            ctx.strokeStyle = "black";
            ctx.strokeText(name, centerX, tagY);
            
            // Use the custom color we pass in
            ctx.fillStyle = textColor; 
            ctx.fillText(name, centerX, tagY);
            
            // ALWAYS reset alpha to 1.0 afterwards!
            ctx.globalAlpha = 1.0; 
        }

            const action = undoStack.pop();
            redoStack.push(action); // Save it so we can Redo it!
            
            action.forEach(change => {
                const key = `${change.x},${change.y},${change.l}`;
                if (change.prevId === -1) {
                    delete worldMap[key];
                } else {
                    const hasCol = worldMap[key] ? worldMap[key].hasCollision : false;
                    worldMap[key] = { tileId: change.prevId, l: change.l, hasCollision: hasCol };
                }
                ws.send(JSON.stringify({ type: 'place_tile', x: change.x, y: change.y, l: change.l, tileId: change.prevId }));
            });
            updateHistoryButtons();
        });

        // ↪️ REDO ACTION
        redoBtn.addEventListener('click', () => {
            if (redoStack.length === 0) return;
            const action = redoStack.pop();
            undoStack.push(action); // Put it back in Undo memory
            
            action.forEach(change => {
                const key = `${change.x},${change.y},${change.l}`;
                if (change.newId === -1) {
                    delete worldMap[key];
                } else {
                    const hasCol = worldMap[key] ? worldMap[key].hasCollision : false;
                    worldMap[key] = { tileId: change.newId, l: change.l, hasCollision: hasCol };
                }
                ws.send(JSON.stringify({ type: 'place_tile', x: change.x, y: change.y, l: change.l, tileId: change.newId }));
            });
            updateHistoryButtons();
        });

        // Helper function to save an action to memory
        function recordHistory(actionArray) {
            if (actionArray.length > 0) {
                undoStack.push(actionArray);
                if (undoStack.length > MAX_HISTORY) undoStack.shift(); // Forget oldest memory if we hit 50
                redoStack.length = 0; // Branching timelines! Clear the redo stack.
                updateHistoryButtons();
            }
        }

        // --- 4. MULTI-SELECT PALETTE ---
        function getPaletteGridXY(e) {
            const rect = pCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaledSize = TILE_SIZE * PALETTE_SCALE;
            return {
                c: Math.floor((clientX - rect.left) / scaledSize),
                r: Math.floor((clientY - rect.top) / scaledSize)
            };
        }

        function handlePaletteDown(e) {
            if (paletteTool !== 'select') return;
            isDraggingBox = true;
            selectStart = getPaletteGridXY(e);
            selectEnd = selectStart;
            drawPalette();
        }

        function handlePaletteMove(e) {
            if (!isDraggingBox || paletteTool !== 'select') return;
            e.preventDefault(); 
            selectEnd = getPaletteGridXY(e);
            drawPalette();
        }

        function handlePaletteUp(e) {
            if (!isDraggingBox || paletteTool !== 'select') return;
            isDraggingBox = false;
            
            const minC = Math.min(selectStart.c, selectEnd.c);
            const maxC = Math.max(selectStart.c, selectEnd.c);
            const minR = Math.min(selectStart.r, selectEnd.r);
            const maxR = Math.max(selectStart.r, selectEnd.r);
            
            selectedGrid.w = (maxC - minC) + 1;
            selectedGrid.h = (maxR - minR) + 1;
            selectedGrid.tiles = [];

            for (let r = 0; r < selectedGrid.h; r++) {
                let rowArray = [];
                for (let c = 0; c < selectedGrid.w; c++) {
                    rowArray.push((minR + r) * cols + (minC + c));
                }
                selectedGrid.tiles.push(rowArray);
            }
            
            eraserBtn.style.borderColor = "transparent"; 
            selectedTileId = selectedGrid.tiles[0][0]; 
        }

        function attachPaletteListeners() {
            pCanvas.onmousedown = handlePaletteDown;
            pCanvas.onmousemove = handlePaletteMove;
            window.addEventListener('mouseup', () => { if(isDraggingBox) handlePaletteUp(); });
            pCanvas.ontouchstart = handlePaletteDown;
            pCanvas.ontouchmove = handlePaletteMove;
            window.addEventListener('touchend', () => { if(isDraggingBox) handlePaletteUp(); });
        }

        function drawPalette() {
            if (!pCtx) return;
            pCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
            pCtx.imageSmoothingEnabled = false;
            pCtx.drawImage(tilesetImage, 0, 0, pCanvas.width, pCanvas.height);

            if (selectStart && selectEnd && paletteTool === 'select') {
                const scaledSize = TILE_SIZE * PALETTE_SCALE;
                const minC = Math.min(selectStart.c, selectEnd.c);
                const maxC = Math.max(selectStart.c, selectEnd.c);
                const minR = Math.min(selectStart.r, selectEnd.r);
                const maxR = Math.max(selectStart.r, selectEnd.r);

                const w = (maxC - minC + 1) * scaledSize;
                const h = (maxR - minR + 1) * scaledSize;

                pCtx.strokeStyle = '#f1c40f';
                pCtx.lineWidth = 2;
                pCtx.strokeRect(minC * scaledSize, minR * scaledSize, w, h);
                pCtx.fillStyle = 'rgba(241, 196, 15, 0.3)';
                pCtx.fillRect(minC * scaledSize, minR * scaledSize, w, h);
            }
        }

        // --- 5. INITIALIZE TOGGLES & TOOLBAR PHYSICS ---
        const editorToolbar = document.getElementById('editor-toolbar');
        const toolbarDragHandle = document.getElementById('toolbar-drag-handle');
        
        // Toolbar Dragging State
        let isDraggingToolbar = false;
        let toolbarOffsetX = 0;
        let toolbarOffsetY = 0;

        // Start dragging the handle
        toolbarDragHandle.addEventListener('touchstart', (e) => {
            isDraggingToolbar = true;
            const touch = e.touches[0];
            const rect = editorToolbar.getBoundingClientRect();
            
            // Calculate where exactly on the handle we grabbed
            toolbarOffsetX = touch.clientX - rect.left;
            toolbarOffsetY = touch.clientY - rect.top;
            
            // Remove the CSS centering transform so our exact Left/Top math works
            editorToolbar.style.transform = 'none'; 
            e.preventDefault();
        }, {passive: false});

        // Move the toolbar
        window.addEventListener('touchmove', (e) => {
            if (!isDraggingToolbar) return;
            const touch = e.touches[0];
            
            let newX = touch.clientX - toolbarOffsetX;
            let newY = touch.clientY - toolbarOffsetY;
            
            // Keep it from dragging off the screen
            if (newX < 0) newX = 0;
            if (newY < 0) newY = 0;
            if (newX + editorToolbar.offsetWidth > window.innerWidth) newX = window.innerWidth - editorToolbar.offsetWidth;
            if (newY + editorToolbar.offsetHeight > window.innerHeight) newY = window.innerHeight - editorToolbar.offsetHeight;

            editorToolbar.style.left = newX + 'px';
            editorToolbar.style.top = newY + 'px';
            editorToolbar.style.bottom = 'auto'; // Disable the default bottom CSS
        }, {passive: false});

        // Drop the toolbar
        window.addEventListener('touchend', () => isDraggingToolbar = false);

        // Edit Mode Toggle (Now opens both the Palette AND the Toolbar)
        appEditMode.addEventListener('click', () => {
            editMode = !editMode;
            tilePalette.style.display = editMode ? 'flex' : 'none';
            editorToolbar.style.display = editMode ? 'flex' : 'none';

        });

        // Close button on the Tile Picker (Closes everything)
        closePalette.addEventListener('click', () => {
            editMode = false;
            tilePalette.style.display = 'none';
            editorToolbar.style.display = 'none';
            tileInspector.style.display = 'none';
        });

        function initPalette() {
            if (!tilesetImage.complete || tilesetImage.naturalWidth === 0) {
                tilesetImage.onload = () => initPalette();
                return;
            }
            pCanvas = document.getElementById('palette-canvas');
            if (!pCanvas) return;
            
            pCtx = pCanvas.getContext('2d');

        eraserBtn.addEventListener('click', () => {
            selectedTileId = selectedTileId === -1 ? 0 : -1;
            eraserBtn.style.borderColor = selectedTileId === -1 ? "#f1c40f" : "transparent"; 
            drawPalette();
