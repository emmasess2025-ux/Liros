<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overhead Chat Demo</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #222; 
            touch-action: none; 
            font-family: sans-serif; 
            
            /* Stops Safari/Chrome from highlighting elements */
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            -moz-user-select: none;      
            -ms-user-select: none;       
            user-select: none;           
        }        

        /* Universal iOS Lockdown */
        * {
            -webkit-tap-highlight-color: transparent; /* Kills the grey flash when tapping */
        }
        
        canvas { display: block; 
                    touch-action: none; /* Double-secures no native zooming */ }
        
       /* Expanding Chat UI */
        #chat-container {
            position: absolute;
            top: 20px;
            left: 20px; /* Moved to Top Left */
            height: 45px;
            width: 45px; /* Starts as a small circle */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1); /* Smooth snap expansion */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #chat-container.expanded {
            width: calc(100vw - 40px); /* Expands across the screen */
            max-width: 400px;
        }
        
        #chat-toggle {
            min-width: 45px;
            height: 45px;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            outline: none;
        }
        
        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 16px;
            padding: 0 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
            -webkit-user-select: auto;
            user-select: auto;
        }
        
        #chat-container.expanded #chat-input {
            opacity: 1;
        }
        
        #send-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 8px 12px;
            margin-right: 5px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            pointer-events: none; /* Can't click when hidden */
        }
        
        #chat-container.expanded #send-btn {
            opacity: 1;
            pointer-events: auto;
        }


        /* Shared Joystick Styles */
        #joystick-zone, #aim-zone {
            position: absolute;
            bottom: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #joystick-zone { left: 30px; }
        #aim-zone { right: 30px; } /* Anchored to the right side */

        #joystick-knob, #aim-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: none;
        }

        /* --- AUTH SCREEN STYLES --- */
        #auth-overlay {
            display: none; /* Start hidden, will be shown when server connects */
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); /* Darkens the game behind it */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Forces it above everything else */
            transition: opacity 0.3s ease;
        }

        #auth-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #auth-box input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 16px;
            outline: none;
            border: 1px solid transparent;
        }

        #auth-box input:focus { border: 1px solid rgba(255,255,255,0.5); }

        .auth-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }

        .auth-btn:active { background: rgba(255, 255, 255, 0.5); }

        #auth-message {
            color: #ff6b6b; /* Soft red for errors */
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }

        #menu-toggle {
            position: absolute;
            top: 75px; /* Sits right below the chat bubble */
            left: 20px;
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
        }

        /* --- APP TRAY STYLES (SIDEWAYS POP) --- */
        #app-tray {
            position: absolute;
            top: 75px;  /* Aligns perfectly with the top of the gear/toggle button */
            left: 75px; /* Pushes it to the right of the button */
            width: 160px; /* Wide enough for the 2x2 grid */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px; 
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 15px;
            opacity: 0;
            pointer-events: none;
            
            /* The Sideways Spring Animation */
            transform-origin: left top; /* Makes it grow outward from the button */
            transform: scale(0.8) translateX(-20px); /* Starts smaller and tucked behind the button */
            transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1.2), transform 0.3s cubic-bezier(0.25, 1, 0.5, 1.2);
            z-index: 99;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #app-tray.open {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateX(0); /* Slides and scales into its natural place */
        }

        /* Individual App Icons */
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-bg {
            width: 50px;
            height: 50px;
            border-radius: 14px; /* The classic iOS app curve */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, filter 0.1s;
        }

        /* The squish effect when you physically tap an app */
        .app-icon:active .app-bg {
            transform: scale(0.85); 
            filter: brightness(0.8);
        }

        .app-icon span {
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* --- TILE PALETTE STYLES ---*/
        #tile-palette {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: none; /* Hidden by default */
            flex-direction: column;
            z-index: 1000;
        }

        #palette-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        #tile-grid {
            flex: 1;
            overflow: auto; /* Allows infinite scrolling horizontally and vertically */
            padding: 10px;
        }

        .palette-tile {
            width: 24px; /* Fixed size so they are easy to tap on mobile */
            height: 24px;
            cursor: pointer;
            image-rendering: pixelated; 
            box-sizing: border-box;
        }

        .palette-tile.selected {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
            position: relative;
            z-index: 2; /* Makes the highlight pop over other tiles */
        }

        /* --- PALETTE RESIZER --- */
        #palette-resizer {
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 100%;
            cursor: ew-resize; /* Shows the left-right stretch cursor */
            background: rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none; /* Crucial so dragging it doesn't accidentally scroll */
        }

        #palette-resizer::after {
            content: "⋮";
            color: white;
            font-size: 20px;
            opacity: 0.5;
        }

        /* --- TILE INSPECTOR STYLES --- */    
        #tile-inspector {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            width: 120px;
            display: none; /* Hidden by default */
            flex-direction: column;
            z-index: 1001;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* Inspector Buttons */
        .layer-btn {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer;
            font-size: 12px; font-weight: bold; flex: 1;
        }
        .layer-btn.active {
            background: #f1c40f; color: black; border-color: white;
        }
        .tool-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
        }
        .tool-btn.active { background: #3498db; border-color: white; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

<div id="auth-overlay">
        <div id="auth-box">
            <button id="close-auth-btn" style="float: right; background: none; border: none; color: white; font-size: 20px; cursor: pointer;">✖</button>
            
            <div id="auth-login-view">
                <h2 style="margin-top: 0; font-family: sans-serif;">Welcome</h2>
                <div id="auth-message"></div>
                
                <input type="text" id="auth-username" placeholder="Username" autocomplete="off" maxlength="12">
                <input type="password" id="auth-password" placeholder="Password">
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="login-btn" class="auth-btn">Log In</button>
                    <button id="register-btn" class="auth-btn" style="background: rgba(255,255,255,0.1);">Sign Up</button>
                </div>
            </div>

            <div id="auth-signout-view" style="display: none;">
                <h2 style="margin-top: 0; font-family: sans-serif;">Sign Out</h2>
                <p style="color: white; font-size: 15px; margin-bottom: 20px;">Are you sure you want to sign out? Your location will be saved securely.</p>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button id="confirm-signout-btn" class="auth-btn" style="background: rgba(255, 107, 107, 0.5);">Yes, Sign Out</button>
                    <button id="cancel-signout-btn" class="auth-btn" style="background: rgba(255,255,255,0.1);">Cancel</button>
                </div>
            </div>

        </div>
    </div>

    <div id="chat-container">
        <button id="chat-toggle">💬</button>
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">➔</button>
    </div>

    <button id="menu-toggle" style="font-size: 20px;">📱</button>
    
    <div id="app-tray">
        <div class="app-icon" id="app-auth">
            <div class="app-bg" style="background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);">🔑</div>
            <span>Log In</span>
        </div>
        
        <div class="app-icon" id="app-inventory">
            <div class="app-bg" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">🎒</div>
            <span>Bag</span>
        </div>

        <div class="app-icon" id="app-friends">
            <div class="app-bg" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">👥</div>
            <span>Friends</span>
        </div>

        <div class="app-icon" id="app-house">
            <div class="app-bg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">🏠</div>
            <span>House</span>
        </div>

        <div class="app-icon" id="app-edit-mode">
            <div class="app-bg" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">🎨</div>
            <span>Edit Mode</span>
        </div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="aim-zone">
        <div id="aim-knob"></div>
    </div>

<div id="tile-palette">
        <div id="palette-resizer"></div>
        <div id="palette-header" style="padding-left: 25px;">
            <span>Tile Picker</span>
            <button id="close-palette">✖</button>
        </div>
        
        <div id="layer-controls" style="display: flex; gap: 5px; padding: 10px 10px 0 25px;">
            <button class="layer-btn active" data-layer="0">L0</button>
            <button class="layer-btn" data-layer="1">L1</button>
            <button class="layer-btn" data-layer="2">L2</button>
            <button class="layer-btn" data-layer="3">L3</button>
            <button class="layer-btn" data-layer="4">L4</button>
        </div>

        <div style="display: flex; gap: 5px; padding: 10px 10px 10px 25px; justify-content: space-between;">
            <button id="tool-pan" class="tool-btn active">🖐️ Pan</button>
            <button id="tool-select" class="tool-btn">🔲 Select</button>
            <button id="eraser-btn" class="tool-btn" style="background: rgba(255, 107, 107, 0.4);">🗑️ Eraser</button>
        </div>

        <div id="tile-grid" style="overflow: auto; flex: 1; padding: 0 10px 10px 25px; background: rgba(0,0,0,0.3); touch-action: pan-x pan-y;">
            <canvas id="palette-canvas" style="image-rendering: pixelated;"></canvas>
        </div>
    </div>

    <div id="tile-inspector">
        <div style="font-size: 10px; opacity: 0.6; margin-bottom: 8px;">TILE SETTINGS</div>
        <button id="inspect-delete" class="tray-btn" style="background: rgba(255,107,107,0.4); margin-bottom: 10px;">🗑 Delete Tile</button>
        <div style="display: flex; align-items: center; gap: 10px; justify-content: center;">
            <span style="font-size: 12px;">Collisions:</span>
            <input type="checkbox" id="inspect-collision" style="width: 18px; height: 18px;">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const tilesetImage = new Image();
        tilesetImage.src = 'All_Tilesets.png';
        
        let editMode = false;
        let selectedTileId = 0;
        const TILE_SIZE = 16; // Your tileset looks like a 16px grid
        const worldMap = {};  // Stores "x,y": tileId

        // Disable the right-click / long-press context menu everywhere
        window.addEventListener('contextmenu', function (e) { 
            e.preventDefault(); 
        }, false);

        // --- ZOOM LOGIC ---
        let zoomLevel = 2; 
        const MIN_ZOOM = 1;
        const MAX_ZOOM = 6;     // Increased maximum zoom
        const ZOOM_STEP = 0.5;  // Allows half-steps for finer zooming
        let initialPinchDistance = null;
        
        canvas.addEventListener('touchstart', (e) => {
            // Kills the iOS double-tap magnifier bubble instantly
            e.preventDefault(); 
            
            // Detect two fingers for pinching
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault(); // Stop the whole browser page from zooming
                
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
        
                const pinchDiff = currentDistance - initialPinchDistance;
        
                // Snap the zoom in or out if fingers moved more than 40 pixels
                if (pinchDiff > 40 && zoomLevel < MAX_ZOOM) { 
                    zoomLevel += ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                } else if (pinchDiff < -40 && zoomLevel > MIN_ZOOM) { 
                    zoomLevel -= ZOOM_STEP;
                    initialPinchDistance = currentDistance; 
                }
            }
        }, {passive: false});
        
        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });
        // Fullscreen & Retina Screen setup
        function resize() {
            // Get the pixel density of the screen (iPhones are usually 2 or 3)
            const dpr = window.devicePixelRatio || 1;
            
            // Set the visual CSS size to match the screen perfectly
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            
            // Multiply the internal canvas resolution by the pixel density to make it sharp
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            
            // Tell the canvas to scale all of our math up to match the new resolution
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // Update the player object to track movement state and current image
        const player = {
            worldX: 0,
            worldY: 0,
            speed: 4,
            vx: 0,
            vy: 0,
            message: "",
            messageTimer: 0,
            isTyping: false,
            
            // Animation variables
            frameX: 0,      
            frameY: 0,      
            tickCount: 0,   
            ticksPerFrame: 5, 
            isMoving: false,          // NEW: Tracks if we are currently walking
            currentImage: null        // NEW: Will hold either walkSprite or idleSprite
        };

        // Load BOTH sprites
        const walkSprite = new Image();
        walkSprite.src = 'walk.png'; // Added cache bust number

        const idleSprite = new Image();
        idleSprite.src = 'idle.png'; 
        
        // Set default to idle
        player.currentImage = idleSprite;

        // --- MULTIPLAYER LOGIC ---
        const otherPlayers = {};
        let myId = null;

        // Auth UI Elements
        const authOverlay = document.getElementById('auth-overlay');
        const authUsername = document.getElementById('auth-username');
        const authPassword = document.getElementById('auth-password');
        const authMessage = document.getElementById('auth-message');
        const loginBtn = document.getElementById('login-btn');
        const registerBtn = document.getElementById('register-btn');

        // UI Elements
        const menuToggle = document.getElementById('menu-toggle');
        const appTray = document.getElementById('app-tray');
        const appAuth = document.getElementById('app-auth'); // The Login App Icon
        const closeAuthBtn = document.getElementById('close-auth-btn'); // The X on the card
        let isLoggedIn = false; // Tracks if we should log in or log out
        const authLoginView = document.getElementById('auth-login-view');
        const authSignoutView = document.getElementById('auth-signout-view');
        const confirmSignoutBtn = document.getElementById('confirm-signout-btn');
        const cancelSignoutBtn = document.getElementById('cancel-signout-btn');

        // 1. Toggle the iOS app tray (Slides out sideways)
        menuToggle.addEventListener('click', () => {
            appTray.classList.toggle('open');
        });

        // 2. Click the Login App -> Opens Card, Chooses View
        appAuth.addEventListener('click', () => {
            // Sledgehammer force the glass card to open
            authOverlay.style.display = 'flex';       
            authOverlay.style.opacity = '1';          
            authOverlay.style.pointerEvents = 'auto'; 
            appTray.classList.remove('open');         

            // Decide which text to show inside the card!
            if (!isLoggedIn) {
                authLoginView.style.display = 'block';
                authSignoutView.style.display = 'none';
            } else {
                authLoginView.style.display = 'none';
                authSignoutView.style.display = 'block';
            }
        });

        // --- Sign Out Confirmation Buttons ---
        confirmSignoutBtn.addEventListener('click', () => {
            // DESTROY THE SAVED VIP TOKEN!
            localStorage.removeItem('liros_game_token');
            
            // Refresh the page to drop back in as a Guest
            window.location.reload(); 
        }); 

        cancelSignoutBtn.addEventListener('click', () => {
            // They changed their mind. Just close the glass card!
            authOverlay.style.display = 'none';
            authOverlay.style.opacity = '0';
            authOverlay.style.pointerEvents = 'none';
        });

        // 3. Close Auth screen if they click the 'X'
        closeAuthBtn.addEventListener('click', () => {
            authOverlay.style.display = 'none';
            authOverlay.style.opacity = '0';
            authOverlay.style.pointerEvents = 'none';
        });
        
        // (Optional but nice) Close the app tray if they click the canvas
        canvas.addEventListener('touchstart', (e) => {
            if (appTray.classList.contains('open') && e.touches.length === 1) {
                appTray.classList.remove('open');
            }
        }, {passive: false});
        

        // Connect to the live cloud server
        const ws = new WebSocket('wss://my-chat-server-ihxw.onrender.com');

        // Connect locally for testing the database
        // const ws = new WebSocket('ws://localhost:8080');

        // --- WEBSOCKET CONNECTION STATE ---
        authMessage.style.color = '#f1c40f'; // Yellow
        authMessage.innerText = "Connecting to server...";
        
        ws.onopen = () => { 
            authMessage.style.color = 'white';
            authMessage.innerText = "Server connected! Please log in.";

            // --- AUTO LOGIN CHECK ---
            // Look inside the browser's secret pocket for a VIP token
            const savedToken = localStorage.getItem('liros_game_token');
            if (savedToken) {
                // If we have one, quietly slip it to the server
                ws.send(JSON.stringify({ type: 'auto_login', token: savedToken }));
            }
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // --- NEW: AUTHENTICATION RESPONSES ---
            if (data.type === 'auth_error') {
                authMessage.style.color = '#ff6b6b'; // Red
                authMessage.innerText = data.message;
            } else if (data.type === 'register_success') {
                authMessage.style.color = '#4cd137'; // Green
                authMessage.innerText = data.message;
            }
// --- EXISTING: GAME INITIALIZATION ---
            else if (data.type === 'init') {
                authOverlay.style.pointerEvents = 'none';
                authOverlay.style.opacity = '0'; 
                
                myId = data.id;
                player.worldX = data.players[myId].worldX;

        // A reusable function to handle moving the visual knob and calculating the math
        function processJoystick(e, zoneElement, knobElement, maxDist) {
            const rect = zoneElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // We loop through e.changedTouches instead of e.touches[0] 
            // to handle true multitouch properly
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }

                knobElement.style.transform = `translate(${dx}px, ${dy}px)`;
                
                // Return normalized values (-1.0 to 1.0) so you can apply them to movement or aiming
                return { x: dx / maxDist, y: dy / maxDist };
            }
        }

        // --- GAME LOOP ---
       function drawGrid(offsetX, offsetY) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            
            // Scale the grid up by our zoom level
            const gridSize = 50 * zoomLevel; 
            
            // Scale the movement offset so the floor slides at the correct speed
            const scaledOffsetX = offsetX * zoomLevel;
            const scaledOffsetY = offsetY * zoomLevel;
        
            const startX = scaledOffsetX % gridSize;
            const startY = scaledOffsetY % gridSize;
        
            // Draw lines (starting slightly off-screen to prevent popping)
            for (let x = startX - gridSize; x < window.innerWidth; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, window.innerHeight); ctx.stroke();
            }
            for (let y = startY - gridSize; y < window.innerHeight; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(window.innerWidth, y); ctx.stroke();
            }
        }

        function updatePlayerDirection() {
            // Check if we are moving this frame
            const currentlyMoving = (player.vx !== 0 || player.vy !== 0);

            // If we just started or stopped moving, reset the animation frame to 0
            if (currentlyMoving !== player.isMoving) {
                player.frameX = 0;
                player.tickCount = 0;
                player.isMoving = currentlyMoving;
            }

            if (player.isMoving) {
                // WE ARE WALKING
                player.currentImage = walkSprite;
                
                // Calculate the angle to determine which row (direction) to use
                const angle = Math.atan2(player.vy, player.vx);
                const deg = angle * (180 / Math.PI); 
            
                if (deg >= 45 && deg <= 135) {
                    player.frameY = 0; // Down
                } else if (deg > 135 || deg < -150) {
                    player.frameY = 1; // Left
                } else if (deg >= -150 && deg < -105) {
                    player.frameY = 2; // Up-Left
                } else if (deg >= -105 && deg <= -75) {
                    player.frameY = 3; // Up
                } else if (deg > -75 && deg <= -30) {
                    player.frameY = 4; // Up-Right
                } else if (deg > -30 && deg < 45) {
                    player.frameY = 5; // Right
                }
            } else {
                // WE ARE IDLE
                player.currentImage = idleSprite;
                // Notice we DO NOT change player.frameY here.
                // This forces the character to stay facing the last direction they walked!
            }
        
            // Advance the animation frame for BOTH walking and idling
            player.tickCount++;
            if (player.tickCount > player.ticksPerFrame) {
                player.tickCount = 0;
                player.frameX = (player.frameX + 1) % 8; // Loop through the 8 columns
            }
        }

       // A helper function to draw perfectly scaled chat bubbles
        function drawDynamicBubble(text, timer, isTyping, x, y, scaledWidth) {
            // If they aren't chatting and aren't typing, do nothing
            if (timer <= 0 && !isTyping) return; 

            // 1. Scale the font size to be a bit smaller (changed from 14 to 12)
            const fontSize = 7 * zoomLevel;
            ctx.font = `bold ${fontSize}px Arial`;
            
            // 2. Scale the outline thickness slightly down for the smaller text
            ctx.lineJoin = "round";
            ctx.lineWidth = 2.5 * zoomLevel; 
            ctx.strokeStyle = "black";
            
            // 3. Anchor it perfectly above the head
            const bubbleY = y + (15 * zoomLevel); 
            const centerX = x + (scaledWidth / 2);
            
            if (timer > 0) {
                // --- ACTUAL CHAT MESSAGE ---
                // Keep standard messages centered
                ctx.textAlign = "center";
                
                ctx.strokeText(text, centerX, bubbleY);
                ctx.fillStyle = "white";
                ctx.fillText(text, centerX, bubbleY);
                
            } else if (isTyping) {
                // --- TYPING INDICATOR ---
                // Lock alignment to the left so the dots don't wiggle back and forth
                ctx.textAlign = "left";
                
                // Animate the dots (1 to 3)
                const dotCount = (Math.floor(Date.now() / 400) % 3) + 1;
                const displayText = ".".repeat(dotCount);
                
                // Pre-measure the maximum width of "..." so we can center the whole block
                const maxTextWidth = ctx.measureText("...").width;
                const startX = centerX - (maxTextWidth / 2);

                ctx.strokeText(displayText, startX, bubbleY);
                ctx.fillStyle = "white";
                ctx.fillText(displayText, startX, bubbleY);
            }
        }

        // Helper function to draw player nametags below the player
        function drawNametag(name, x, y, scaledWidth, scaledHeight) {
            if (!name) return; 

            const fontSize = 10 * zoomLevel; 
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = "center";
            
            // Push it down below the sprite's feet
            const tagY = y + scaledHeight + (12 * zoomLevel); 
            const centerX = x + (scaledWidth / 2);
            
            // Make the text 70% transparent so it doesn't block the floor heavily
            ctx.globalAlpha = 0.7; 
            
            ctx.lineJoin = "round";
            ctx.lineWidth = 2.5 * zoomLevel;
            ctx.strokeStyle = "black";
            ctx.strokeText(name, centerX, tagY);
            
            ctx.fillStyle = "#f1c40f"; 
            ctx.fillText(name, centerX, tagY);
            
            // ALWAYS reset alpha to 1.0 afterwards so the rest of the game doesn't turn transparent!
            ctx.globalAlpha = 1.0; 
        }

        // --- 4. MULTI-SELECT PALETTE ---
        function getPaletteGridXY(e) {
            const rect = pCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaledSize = TILE_SIZE * PALETTE_SCALE;
            return {
                c: Math.floor((clientX - rect.left) / scaledSize),
                r: Math.floor((clientY - rect.top) / scaledSize)
            };
        }

        function handlePaletteDown(e) {
            if (paletteTool !== 'select') return;
            isDraggingBox = true;
            selectStart = getPaletteGridXY(e);
            selectEnd = selectStart;
            drawPalette();
        }

        function handlePaletteMove(e) {
            if (!isDraggingBox || paletteTool !== 'select') return;
            e.preventDefault(); 
            selectEnd = getPaletteGridXY(e);
            drawPalette();
        }

        function handlePaletteUp(e) {
            if (!isDraggingBox || paletteTool !== 'select') return;
            isDraggingBox = false;
            
            const minC = Math.min(selectStart.c, selectEnd.c);
            const maxC = Math.max(selectStart.c, selectEnd.c);
            const minR = Math.min(selectStart.r, selectEnd.r);
            const maxR = Math.max(selectStart.r, selectEnd.r);
            
            selectedGrid.w = (maxC - minC) + 1;
            selectedGrid.h = (maxR - minR) + 1;
            selectedGrid.tiles = [];

            for (let r = 0; r < selectedGrid.h; r++) {
                let rowArray = [];
                for (let c = 0; c < selectedGrid.w; c++) {
                    rowArray.push((minR + r) * cols + (minC + c));
                }
                selectedGrid.tiles.push(rowArray);

            selectedTileId = selectedGrid.tiles[0][0];

        function attachPaletteListeners() {
            pCanvas.onmousedown = handlePaletteDown;

            pCanvas.ontouchstart = handlePaletteDown;
            pCanvas.ontouchmove = handlePaletteMove;
            window.addEventListener('touchend', () => { if(isDraggingBox) handlePaletteUp(); });
        }

        function drawPalette() {
            if (!pCtx) return;
            pCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
            pCtx.imageSmoothingEnabled = false;
            pCtx.drawImage(tilesetImage, 0, 0, pCanvas.width, pCanvas.height);

            if (selectStart && selectEnd && paletteTool === 'select') {
                const scaledSize = TILE_SIZE * PALETTE_SCALE;
                const minC = Math.min(selectStart.c, selectEnd.c);
                const maxC = Math.max(selectStart.c, selectEnd.c);
                const minR = Math.min(selectStart.r, selectEnd.r);
                const maxR = Math.max(selectStart.r, selectEnd.r);

                const w = (maxC - minC + 1) * scaledSize;
                const h = (maxR - minR + 1) * scaledSize;

                pCtx.strokeStyle = '#f1c40f';
                pCtx.lineWidth = 2;
                pCtx.strokeRect(minC * scaledSize, minR * scaledSize, w, h);
                pCtx.fillStyle = 'rgba(241, 196, 15, 0.3)';
                pCtx.fillRect(minC * scaledSize, minR * scaledSize, w, h);
            }
        }

            const worldClickX = (touch.clientX - (window.innerWidth / 2)) / zoomLevel + player.worldX;
            const worldClickY = (touch.clientY - (window.innerHeight / 2)) / zoomLevel + player.worldY;
            
            const originGridX = Math.floor(worldClickX / TILE_SIZE);
            const originGridY = Math.floor(worldClickY / TILE_SIZE);

            // BULK PAINTING
            tileInspector.style.display = 'none';
            for (let r = 0; r < selectedGrid.h; r++) {
                for (let c = 0; c < selectedGrid.w; c++) {
                    const paintX = originGridX + c;
                    const paintY = originGridY + r;
                    const tId = selectedGrid.tiles[r][c];
                    
                    worldMap[`${paintX},${paintY},${activeLayer}`] = { tileId: tId, l: activeLayer, hasCollision: false };
                    ws.send(JSON.stringify({ type: 'place_tile', x: paintX, y: paintY, l: activeLayer, tileId: tId }));
                }
            }
        }, {passive: false});

        // --- 7. INSPECTOR UPDATES ---
        inspectCollision.onchange = () => {
            if (!inspectingCoord) return;
            const [gx, gy, gl] = inspectingCoord.split(',').map(Number);
            
            worldMap[inspectingCoord].hasCollision = inspectCollision.checked;
            
            ws.send(JSON.stringify({
                type: 'update_tile_metadata', 
                x: gx, y: gy, layer: gl,
                hasCollision: inspectCollision.checked
            }));
        };

        inspectDelete.onclick = () => {
            if (!inspectingCoord) return;
            const [gx, gy, gl] = inspectingCoord.split(',').map(Number);
            ws.send(JSON.stringify({ type: 'place_tile', x: gx, y: gy, l: gl, tileId: -1 })); 
            delete worldMap[inspectingCoord];
            tileInspector.style.display = 'none';
            inspectingCoord = null;
        };
        
        function update() {
            // --- COLLISION CHECK (MULTI-LAYER) ---
            let nextX = player.worldX + player.vx;
            let nextY = player.worldY + player.vy;

            const gridX = Math.floor(nextX / TILE_SIZE);
            const gridY = Math.floor(nextY / TILE_SIZE);
            
            // Loop through all 5 layers to see if ANY tile at this X,Y has a collision wall
            let hitWall = false;
            for (let l = 0; l <= 4; l++) {
                if (worldMap[`${gridX},${gridY},${l}`] && worldMap[`${gridX},${gridY},${l}`].hasCollision) {
                    hitWall = true;
                    break;
                }
            }

            if (hitWall) {
                // Hit a wall! Stop momentum.
                player.vx = 0;
                player.vy = 0;
            }

            // Apply movement
            player.worldX += player.vx;
            player.worldY += player.vy;
        
            // Clear the screen using window dimensions
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            
            // THE SECRET SAUCE: Prevents pixel art from getting blurry
            ctx.imageSmoothingEnabled = false; 
            ctx.webkitImageSmoothingEnabled = false; // Forces Safari iOS to respect pixels!
        
            // Calculate center using window dimensions instead of raw canvas dimensions
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;   
        
            drawGrid(-player.worldX, -player.worldY);

           // --- DRAW THE WORLD (LAYER BY LAYER) ---
            const tilesPerRow = Math.floor(tilesetImage.width / TILE_SIZE);
            
            // Draw from bottom (0) to top (4)
            for (let currentLayer = 0; currentLayer <= 4; currentLayer++) {
                
                // THE LAYER FADE EFFECT
                if (editMode) {
                    ctx.globalAlpha = (currentLayer === activeLayer) ? 1.0 : 0.3; // Faint inactive layers
                } else {
                    ctx.globalAlpha = 1.0; // Normal game view
                }

                for (let key in worldMap) {
                    const tileData = worldMap[key];
                    if (!tileData || tileData.l !== currentLayer) continue; // Only draw current layer
                    
                    const parts = key.split(',');
                    const tx = Number(parts[0]);
                    const ty = Number(parts[1]);
                    
                    const drawX = Math.round(screenCenterX + (tx * TILE_SIZE - player.worldX) * zoomLevel);
                    const drawY = Math.round(screenCenterY + (ty * TILE_SIZE - player.worldY) * zoomLevel);
                    const scaledSize = TILE_SIZE * zoomLevel;

                    const sx = (tileData.tileId % tilesPerRow) * TILE_SIZE;
                    const sy = Math.floor(tileData.tileId / tilesPerRow) * TILE_SIZE;
                    ctx.drawImage(tilesetImage, sx, sy, TILE_SIZE, TILE_SIZE, drawX, drawY, scaledSize, scaledSize);

                    // Draw Selection Box if Inspecting
                    if (editMode && inspectingCoord === key && currentLayer === activeLayer) {
                        ctx.strokeStyle = '#f1c40f';
                        ctx.lineWidth = 2 * zoomLevel;
                        ctx.strokeRect(drawX, drawY, scaledSize, scaledSize);
                    }
                }
            }
            ctx.globalAlpha = 1.0; // ALWAYS reset alpha before drawing players!

            updatePlayerDirection();
            
            // 6. Calculate the size of a single frame dynamically using currentImage
            const frameWidth = player.currentImage.width / 8;
            const frameHeight = player.currentImage.height / 6;

            
            const cropX = player.frameX * frameWidth;
            const cropY = player.frameY * frameHeight;
            const scaledWidth = frameWidth * zoomLevel;
            const scaledHeight = frameHeight * zoomLevel;
            const drawX = Math.round(screenCenterX - (scaledWidth / 2));
            const drawY = Math.round(screenCenterY - (scaledHeight / 2));

            // --- DRAW OTHER PLAYERS ---
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                if (!p || p.worldX === undefined || !p.username) continue;
                // THE LERP MAGIC: Smoothly slide actual X/Y towards target X/Y
                // 0.3 means it moves 30% of the distance to the target every frame.
                p.worldX += (p.targetX - p.worldX) * 0.3; 
                p.worldY += (p.targetY - p.worldY) * 0.3;
                
                // Calculate where they are on the screen relative to YOU
                const offsetX = p.worldX - player.worldX;
                const offsetY = p.worldY - player.worldY;
                
                const pScaledWidth = frameWidth * zoomLevel;
                const pScaledHeight = frameHeight * zoomLevel;
                
                const pDrawX = Math.round(screenCenterX + (offsetX * zoomLevel) - (pScaledWidth / 2));
                const pDrawY = Math.round(screenCenterY + (offsetY * zoomLevel) - (pScaledHeight / 2));
                
                // Choose their sprite based on if they are moving
                const pImage = p.isMoving ? walkSprite : idleSprite;
                
                // Ensure frame sizes are based on the correct sprite sheet
                const pFrameW = pImage.width / 8;
                const pFrameH = pImage.height / 6;
                const pCropX = p.frameX * pFrameW;
                const pCropY = p.frameY * pFrameH;

                ctx.drawImage(
                    pImage,
                    pCropX, pCropY, pFrameW, pFrameH,
                    pDrawX, pDrawY,
                    pScaledWidth, pScaledHeight
                );

                // Draw their chat bubble or typing indicator
                drawDynamicBubble(p.message, p.messageTimer, p.isTyping, pDrawX, pDrawY, pScaledWidth);
              // Draw their nametag
                drawNametag(p.username, pDrawX, pDrawY, pScaledWidth);
            }
            
            // 8. Draw the cropped frame using currentImage
            ctx.drawImage(
                player.currentImage,
                cropX, cropY, frameWidth, frameHeight,
                drawX, drawY, 
                scaledWidth, scaledHeight
            );
            
           // Draw your own chat bubble or typing indicator
            drawDynamicBubble(player.message, player.messageTimer, player.isTyping, drawX, drawY, scaledWidth);
            
            // Draw your own nametag (Notice it uses 'player', not 'p'!)
            drawNametag(player.username, drawX, drawY, scaledWidth, scaledHeight);

            if (player.messageTimer > 0) player.messageTimer--;
        
            requestAnimationFrame(update);
        }

        // Start loop
        update();
    </script>
</body>
