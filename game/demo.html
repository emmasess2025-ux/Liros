        // --- 6. GAME CANVAS SELECTOR ---
        function getWorldGridXY(clientX, clientY) {
            const worldClickX = (clientX - (window.innerWidth / 2)) / zoomLevel + player.worldX;
            const worldClickY = (clientY - (window.innerHeight / 2)) / zoomLevel + player.worldY;
            return {
                x: Math.floor(worldClickX / TILE_SIZE),
                y: Math.floor(worldClickY / TILE_SIZE)
            };
        }

        // --- 6. GAME CANVAS SELECTOR & PAINTING ---
        canvas.addEventListener('touchstart', (e) => {
            if (!editMode || e.touches.length > 1) return;
            const touch = e.touches[0];
            const gridPos = getWorldGridXY(touch.clientX, touch.clientY);
            const centerKey = `${gridPos.x},${gridPos.y},${activeLayer}`;

            if (worldMode === 'select') {
                isDraggingMapBox = true;
                mapSelectStart = gridPos;
                mapSelectEnd = gridPos;
                mapSelectionBox = null;
                tileInspector.style.display = 'none';
                return;
            }

            // --- SINGLE ERASER ---
            if (selectedTileId === -1) {
                tileInspector.style.display = 'none';
                const prevId = worldMap[centerKey] ? worldMap[centerKey].tileId : -1;
                
                if (prevId !== -1) {
                    recordHistory([{ x: gridPos.x, y: gridPos.y, l: activeLayer, prevId: prevId, newId: -1 }]);
                    delete worldMap[centerKey];
                    ws.send(JSON.stringify({ type: 'place_tile', x: gridPos.x, y: gridPos.y, l: activeLayer, tileId: -1 }));
                }
                return;
            }

            // --- INSPECTING TILE ---
            if (worldMap[centerKey] && selectedGrid.w === 1 && selectedGrid.h === 1) {
                inspectingCoord = centerKey;
                mapSelectionBox = null;
                inspectCopyBtn.style.display = 'none';
                tileInspector.style.display = 'flex';
                tileInspector.style.left = `${touch.clientX + 20}px`;
                tileInspector.style.top = `${touch.clientY - 50}px`;
                inspectCollision.checked = worldMap[centerKey].hasCollision;
                return;
            }

            // --- BULK / SINGLE PAINTING ---
            tileInspector.style.display = 'none';
            let currentAction = [];

            for (let r = 0; r < selectedGrid.h; r++) {
                for (let c = 0; c < selectedGrid.w; c++) {
                    const paintX = gridPos.x + c;
                    const paintY = gridPos.y + r;
                    const key = `${paintX},${paintY},${activeLayer}`;
                    const tId = selectedGrid.tiles[r][c];
                    
                    const prevId = worldMap[key] ? worldMap[key].tileId : -1;
                    
                    // Only update the database if the tile actually changed!
                    if (prevId !== tId) {
                        currentAction.push({ x: paintX, y: paintY, l: activeLayer, prevId: prevId, newId: tId });
                        
                        if (tId === -1) {
                            delete worldMap[key];
                            ws.send(JSON.stringify({ type: 'place_tile', x: paintX, y: paintY, l: activeLayer, tileId: -1 }));
                        } else {
                            worldMap[key] = { tileId: tId, l: activeLayer, hasCollision: false };
                            ws.send(JSON.stringify({ type: 'place_tile', x: paintX, y: paintY, l: activeLayer, tileId: tId }));
                        }
                    }
                }
            }
            // Save this paint stroke to our time machine!
            recordHistory(currentAction);
            
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (!editMode || !isDraggingMapBox || worldMode !== 'select') return;
            e.preventDefault(); 
            mapSelectEnd = getWorldGridXY(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            if (!editMode || !isDraggingMapBox || worldMode !== 'select') return;
            isDraggingMapBox = false;

            mapSelectionBox = {
                minX: Math.min(mapSelectStart.x, mapSelectEnd.x),
                maxX: Math.max(mapSelectStart.x, mapSelectEnd.x),
                minY: Math.min(mapSelectStart.y, mapSelectEnd.y),
                maxY: Math.max(mapSelectStart.y, mapSelectEnd.y)
            };

            // POP THE INSPECTOR FOR THE BULK AREA!
            tileInspector.style.display = 'flex';
            tileInspector.style.left = `${e.changedTouches[0].clientX + 20}px`;
            tileInspector.style.top = `${e.changedTouches[0].clientY - 50}px`;
            
            // Show the copy button
            inspectCopyBtn.style.display = 'block'; 
            
            // --- NEW: SCAN THE SELECTION TO SEE IF IT HAS COLLISIONS ---
            let areaHasCollision = false;
            for(let r = mapSelectionBox.minY; r <= mapSelectionBox.maxY; r++) {
                for(let c = mapSelectionBox.minX; c <= mapSelectionBox.maxX; c++) {
                    if (worldMap[`${c},${r},${activeLayer}`] && worldMap[`${c},${r},${activeLayer}`].hasCollision) {
                        areaHasCollision = true;
                    }
                }
            }
            // Check the box if the area already has collision tiles!
            inspectCollision.checked = areaHasCollision; 
        });

        // --- 7. INSPECTOR ACTIONS (Handles Single & Bulk) ---
        inspectCopyBtn.onclick = () => {
            if (!mapSelectionBox) return;
            selectedGrid.w = (mapSelectionBox.maxX - mapSelectionBox.minX) + 1;
            selectedGrid.h = (mapSelectionBox.maxY - mapSelectionBox.minY) + 1;
            selectedGrid.tiles = [];

            for (let r = 0; r < selectedGrid.h; r++) {
                let rowArray = [];
                for (let c = 0; c < selectedGrid.w; c++) {
                    const key = `${mapSelectionBox.minX + c},${mapSelectionBox.minY + r},${activeLayer}`;
                    rowArray.push(worldMap[key] ? worldMap[key].tileId : -1);
                }
                selectedGrid.tiles.push(rowArray);
            }
            worldPaintBtn.onclick(); // Switch to paint mode to paste it!
        };

        inspectCollision.onchange = () => {
            if (mapSelectionBox) { // BULK COLLISION
                for(let r = mapSelectionBox.minY; r <= mapSelectionBox.maxY; r++) {
                    for(let c = mapSelectionBox.minX; c <= mapSelectionBox.maxX; c++) {
                        const key = `${c},${r},${activeLayer}`;
                        if(worldMap[key]) {
                            worldMap[key].hasCollision = inspectCollision.checked;
                            ws.send(JSON.stringify({
                                type: 'update_tile_metadata', x: c, y: r, layer: activeLayer, hasCollision: inspectCollision.checked
                            }));
                        }
                    }
                }
            } else if (inspectingCoord) { // SINGLE COLLISION
                const [gx, gy, gl] = inspectingCoord.split(',').map(Number);
                worldMap[inspectingCoord].hasCollision = inspectCollision.checked;
                ws.send(JSON.stringify({
                    type: 'update_tile_metadata', x: gx, y: gy, layer: gl, hasCollision: inspectCollision.checked
                }));
            }
        };

        inspectDelete.onclick = () => {
            let currentAction = [];
            
            if (mapSelectionBox) { // BULK DELETE
                for(let r = mapSelectionBox.minY; r <= mapSelectionBox.maxY; r++) {
                    for(let c = mapSelectionBox.minX; c <= mapSelectionBox.maxX; c++) {
                        const key = `${c},${r},${activeLayer}`;
                        const prevId = worldMap[key] ? worldMap[key].tileId : -1;
                        
                        if (prevId !== -1) {
                            currentAction.push({ x: c, y: r, l: activeLayer, prevId: prevId, newId: -1 });
                            ws.send(JSON.stringify({ type: 'place_tile', x: c, y: r, l: activeLayer, tileId: -1 })); 
                            delete worldMap[key];
                        }
                    }
                }
            } else if (inspectingCoord) { // SINGLE DELETE
                const [gx, gy, gl] = inspectingCoord.split(',').map(Number);
                const prevId = worldMap[inspectingCoord] ? worldMap[inspectingCoord].tileId : -1;
                
                if (prevId !== -1) {
                    currentAction.push({ x: gx, y: gy, l: gl, prevId: prevId, newId: -1 });
                    ws.send(JSON.stringify({ type: 'place_tile', x: gx, y: gy, l: gl, tileId: -1 })); 
                    delete worldMap[inspectingCoord];
                }
            }
            
            recordHistory(currentAction); // Save it to the time machine!

            tileInspector.style.display = 'none';
            inspectingCoord = null;
            mapSelectionBox = null;
        };

        // --- UPGRADED MINIMAP DRAW ENGINE ---
        function drawMinimap() {
            if (!mCtx) return;
            mCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            
            // Update Player Count
            const totalPlayers = Object.keys(otherPlayers).length + 1; // Others + You
            mapPlayerCount.innerText = `Players: ${totalPlayers}`;

            // Calculate Camera Center (Your position + swipe offsets)
            const cameraX = player.worldX + mapOffsetX;
            const cameraY = player.worldY + mapOffsetY;
            
            const scale = minimapZoom / TILE_SIZE; // Converts world pixels to mini-map pixels
            
            // Optimization bounds (don't draw tiles way off screen)
            const mapRadiusX = (minimapCanvas.width / 2) / scale;
            const mapRadiusY = (minimapCanvas.height / 2) / scale;

            // 1. DRAW TILES
            const tilesPerRow = Math.floor(tilesetImage.width / TILE_SIZE);
            for (let currentLayer = 0; currentLayer <= 7; currentLayer++) {
                for (let key in worldMap) {
                    const tileData = worldMap[key];
                    if (!tileData || tileData.l !== currentLayer) continue;
                    
                    const [tx, ty] = key.split(',').map(Number);
                    const worldTileX = tx * TILE_SIZE;
                    const worldTileY = ty * TILE_SIZE;
                    
                    // Culling: Skip if tile is off the mini-map canvas
                    if (Math.abs(worldTileX - cameraX) > mapRadiusX + TILE_SIZE || 
                        Math.abs(worldTileY - cameraY) > mapRadiusY + TILE_SIZE) continue;
                    
                    const drawX = (worldTileX - cameraX) * scale + (minimapCanvas.width / 2);
                    const drawY = (worldTileY - cameraY) * scale + (minimapCanvas.height / 2);
                    
                    const sx = (tileData.tileId % tilesPerRow) * TILE_SIZE;
                    const sy = Math.floor(tileData.tileId / tilesPerRow) * TILE_SIZE;
                    
                    mCtx.drawImage(tilesetImage, sx, sy, TILE_SIZE, TILE_SIZE, drawX, drawY, minimapZoom, minimapZoom);
                }
            }

            // 1. ADD 'targetName' TO THE END OF THE PARAMETERS
            function drawMinimapPlayer(pX, pY, pFrameX, pFrameY, pImage, color, targetName) {
                const mX = (pX - cameraX) * scale + (minimapCanvas.width / 2);
                const mY = (pY - cameraY) * scale + (minimapCanvas.height / 2);
                
                const pFrameW = pImage.width / 8;
                const pFrameH = pImage.height / 6;
                
                const cropW = pFrameW;
                const cropH = pFrameH / 2; 
                const cropX = pFrameX * pFrameW;
                const cropY = pFrameY * pFrameH; 
                
                const drawSizeW = 48; 
                const drawSizeH = 48 * (cropH / cropW); 
                
                const glowRadius = drawSizeW * 0.03; 
                const glowOffsetY = drawSizeH * 0.60; 
                
                // --- THE FIX: Use targetName instead of p.username ---
                const isFriend = (player.friends && player.friends.includes(targetName)); 
                
                if (isFriend || color === "#f1c40f") { 
                    mCtx.fillStyle = color;
                    mCtx.beginPath();
                    mCtx.arc(mX, mY + glowOffsetY, glowRadius, 0, Math.PI * 2); 
                    mCtx.fill();
                }

                mCtx.drawImage(
                    pImage,
                    cropX, cropY, cropW, cropH,
                    mX - (drawSizeW / 2), mY - (drawSizeH / 2),
                    drawSizeW, drawSizeH
                );
            }

            // 3. DRAW OTHER PLAYERS (Pass p.username at the end)
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                if (!p || p.worldX === undefined) continue;
                const pImage = p.isMoving ? walkSprite : idleSprite;
                drawMinimapPlayer(p.worldX, p.worldY, p.frameX, p.frameY, pImage, getColorForString(p.username), p.username);
            }
            // 4. DRAW LOCAL PLAYER (Pass player.username at the end)
            drawMinimapPlayer(player.worldX, player.worldY, player.frameX, player.frameY, player.currentImage, "#f1c40f", player.username);
            }

        // --- PROFILE MODAL LOGIC ---
        const profileModal = document.getElementById('profile-modal');
        const closeProfile = document.getElementById('close-profile');
        const profileCanvas = document.getElementById('profile-canvas');
        const prCtx = profileCanvas.getContext('2d');
        const profileNameDisplay = document.getElementById('profile-name-display');
        const profileEditControls = document.getElementById('profile-edit-controls');
        const profileOtherControls = document.getElementById('profile-other-controls');
        const editNameInput = document.getElementById('edit-name-input');
        const saveNameBtn = document.getElementById('save-name-btn');
        const addFriendBtn = document.getElementById('add-friend-btn');

        let isProfileOpen = false;
        let profileTargetId = null; // 'self' or the ID of the other player
        let profileAnimFrame = 0;

        // 1. Detect Taps on Players in the Game World
        canvas.addEventListener('touchstart', (e) => {
            if (editMode || e.touches.length > 1) return; // Don't trigger if building
            
            const touch = e.touches[0];
            const clickX = (touch.clientX - (window.innerWidth / 2)) / zoomLevel + player.worldX;
            const clickY = (touch.clientY - (window.innerHeight / 2)) / zoomLevel + player.worldY;

            const HIT_RADIUS = 20; // How close to the center of the sprite they have to tap

            // Check if tapped SELF
            if (Math.abs(clickX - player.worldX) < HIT_RADIUS && Math.abs(clickY - player.worldY) < HIT_RADIUS) {
                openProfile('self', player.username);
                return;
            }

            // Check if tapped OTHERS
            for (let id in otherPlayers) {
                if (Math.abs(clickX - otherPlayers[id].worldX) < HIT_RADIUS && Math.abs(clickY - otherPlayers[id].worldY) < HIT_RADIUS) {
                    openProfile(id, otherPlayers[id].username);
                    return;
                }
            }
        });

        // 2. Open the Modal & Setup UI
        function openProfile(targetId, username) {
            isProfileOpen = true;
            profileTargetId = targetId;
            profileNameDisplay.innerText = username;
            profileModal.style.display = 'flex';

            if (targetId === 'self') {
                profileEditControls.style.display = 'flex';
                profileOtherControls.style.display = 'none';
                editNameInput.value = username;
            } else {
                profileEditControls.style.display = 'none';
                profileOtherControls.style.display = 'flex';
            }
            
            drawProfileAnimation(); // Kick off the loop
        }

        closeProfile.addEventListener('click', () => {
            isProfileOpen = false;
            profileModal.style.display = 'none';
        });

        // 3. The Isolated Walking Animation for the UI
        function drawProfileAnimation() {
            if (!isProfileOpen) return; // Stop loop when closed
            
            prCtx.clearRect(0, 0, profileCanvas.width, profileCanvas.height);
            
            // Advance fake animation frame
            profileAnimFrame = (profileAnimFrame + 0.1) % 8; 
            const fX = Math.floor(profileAnimFrame);
            const fY = 0; // Always walk straight down towards the camera
            
            const pFrameW = walkSprite.width / 8;
            const pFrameH = walkSprite.height / 6;
            
            // Draw them MASSIVE on the profile canvas
            prCtx.drawImage(
                walkSprite,
                fX * pFrameW, fY * pFrameH, pFrameW, pFrameH,
                10, 20, 130, 130 * (pFrameH/pFrameW)
            );

            requestAnimationFrame(drawProfileAnimation);
        }

        // 4. WebSockets Hooks
        saveNameBtn.addEventListener('click', () => {
            const newName = editNameInput.value.trim();
            if (newName) {
                ws.send(JSON.stringify({ type: 'change_username', newUsername: newName }));
                profileNameDisplay.innerText = newName;
                player.username = newName; // Update locally immediately
            }
        });

        addFriendBtn.addEventListener('click', () => {
            ws.send(JSON.stringify({ type: 'add_friend', friendName: profileNameDisplay.innerText }));
            addFriendBtn.innerText = "✓ Friend Added";
            addFriendBtn.style.background = "#27ae60";
            
            // Add to local array so the minimap dot appears instantly!
            if (!player.friends) player.friends = [];
            player.friends.push(profileNameDisplay.innerText);
        });

        // --- INVENTORY & HOTBAR LOGIC ---
        const appInventory = document.getElementById('app-inventory');
        const inventoryModal = document.getElementById('inventory-modal');
        const closeInventory = document.getElementById('close-inventory');
        const inventoryGrid = document.getElementById('inventory-grid');
        
        const equipModal = document.getElementById('equip-modal');
        const closeEquipModal = document.getElementById('close-equip-modal');
        const equipSlotsContainer = document.getElementById('equip-slots-container');
        
        let equippingSlotIndex = 0; // Remembers which slot you are assigning an item to

        // 1. App Icon opens the Chooser Modal first!
        appInventory.addEventListener('click', () => {
            appTray.classList.remove('open');
            renderEquipModal();
            equipModal.style.display = 'flex';
        });

        closeEquipModal.addEventListener('click', () => equipModal.style.display = 'none');
        closeInventory.addEventListener('click', () => inventoryModal.style.display = 'none');

        // 2. Draws the 3 Big Slots to choose from
        function renderEquipModal() {
            equipSlotsContainer.innerHTML = "";
            for (let i = 0; i < 3; i++) {
                const slot = document.createElement('div');
                slot.style.width = "60px"; slot.style.height = "60px";
                slot.style.background = "rgba(0,0,0,0.4)";
                slot.style.border = "2px solid rgba(255,255,255,0.3)";
                slot.style.borderRadius = "10px";
                slot.style.display = "flex"; slot.style.justifyContent = "center"; slot.style.alignItems = "center";
                slot.style.cursor = "pointer";

                // Show what is currently in that slot
                if (player.hotbar[i] === "ghost_gun") {
                    const iconElement = getGunIconCanvas();
                    if (iconElement) { iconElement.style.width = "80%"; slot.appendChild(iconElement); } 
                    else { slot.innerText = "🔫"; slot.style.fontSize = "30px"; }
                }

                // Click a slot -> Open the full backpack to fill it!
                slot.onclick = () => {
                    equippingSlotIndex = i; // Remember the slot!
                    equipModal.style.display = 'none';
                    renderInventory();
                    inventoryModal.style.display = 'flex';
                };
                equipSlotsContainer.appendChild(slot);
            }
        }

        function getGunIconCanvas() {
            if (!ghostGunSprite.complete || ghostGunSprite.naturalWidth === 0) return null; 
            const tCanvas = document.createElement('canvas');
            tCanvas.width = 48; tCanvas.height = 48; 
            const tCtx = tCanvas.getContext('2d');
            tCtx.imageSmoothingEnabled = false;
            const frameW = ghostGunSprite.width / 8;
            const frameH = ghostGunSprite.height / 6; 
            tCtx.drawImage(ghostGunSprite, 0, 1 * frameH, frameW, frameH, 0, 0, 48, 48);
            return tCanvas;
        }

        function renderInventory() {
            inventoryGrid.innerHTML = ""; 

            // --- THE "EMPTY" TOOL ---
            const noneSlot = document.createElement('div');
            noneSlot.style.width = "100%"; noneSlot.style.aspectRatio = "1/1";
            noneSlot.style.background = "rgba(255, 107, 107, 0.15)"; 
            noneSlot.style.border = "1px dashed rgba(255, 255, 255, 0.3)";
            noneSlot.style.borderRadius = "8px"; noneSlot.style.display = "flex";
            noneSlot.style.justifyContent = "center"; noneSlot.style.alignItems = "center";
            noneSlot.style.cursor = "pointer";
            noneSlot.innerHTML = "<span style='font-size: 9px; font-weight: bold; opacity: 0.7; color: #ff6b6b;'>EMPTY</span>";

            noneSlot.onclick = () => {
                player.hotbar[equippingSlotIndex] = "none";
                // If we just emptied the slot we are currently holding, de-equip immediately
                if (player.activeSlot === equippingSlotIndex) {
                    player.equippedWeapon = "none";
                }
                renderHudHotbar();
                inventoryModal.style.display = 'none';
                lastNetworkString = ""; 
            };
            inventoryGrid.appendChild(noneSlot);

            // Draw your actual items (looping 11 times to keep the 12-slot grid clean)
            for (let i = 0; i < 11; i++) {
                const slot = document.createElement('div');
                slot.style.width = "100%"; slot.style.aspectRatio = "1/1";
                slot.style.background = "rgba(0,0,0,0.4)"; slot.style.border = "1px solid rgba(255,255,255,0.1)";
                slot.style.borderRadius = "8px"; slot.style.display = "flex";
                slot.style.justifyContent = "center"; slot.style.alignItems = "center"; slot.style.cursor = "pointer";

                // --- THE FIX: Safety fallback in case inventory is somehow missing ---
                const safeInventory = player.inventory || []; 
                const itemId = safeInventory[i];
                
                if (itemId === "ghost_gun") {
                    const iconElement = getGunIconCanvas();
                    if (iconElement) { iconElement.style.width = "80%"; slot.appendChild(iconElement); } 
                    
                    slot.onclick = () => {
                        player.hotbar[equippingSlotIndex] = "ghost_gun";
                        if (player.activeSlot === equippingSlotIndex) {
                            player.equippedWeapon = "ghost_gun";
                        }
                        renderHudHotbar();
                        inventoryModal.style.display = 'none';
                        lastNetworkString = ""; 
                    };
                }
                inventoryGrid.appendChild(slot);
            }
        }

        function renderHudHotbar() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById('hud-slot-' + i);
                slot.innerHTML = ""; 
                
                // --- THE FIX: Only glow if Active AND a weapon is equipped ---
                if (player.activeSlot === i && player.equippedWeapon !== "none") {
                    slot.style.border = "2px solid #f1c40f";
                    slot.style.boxShadow = "0 0 15px rgba(241, 196, 15, 0.6)";
                } else {
                    slot.style.border = "2px solid rgba(255, 255, 255, 0.2)";
                    slot.style.boxShadow = "none";
                }

                if (player.hotbar[i] === "ghost_gun") {
                    const iconElement = getGunIconCanvas();
                    if (iconElement) { 
                        iconElement.style.width = "70%"; 
                        // Fade the icon if it's in the slot but toggled off
                        iconElement.style.opacity = (player.activeSlot === i && player.equippedWeapon === "none") ? "0.3" : "1";
                        slot.appendChild(iconElement); 
                    } 
                }

                slot.onclick = () => {
                    if (player.activeSlot === i) {
                        // Toggle the weapon on/off if clicking the same slot
                        player.equippedWeapon = (player.equippedWeapon === "none") ? player.hotbar[i] : "none";
                        player.ammo = WEAPONS[player.equippedWeapon] ? WEAPONS[player.equippedWeapon].magSize : 0;
                    } else {
                        // Switch slots and auto-equip whatever is there
                        player.activeSlot = i;
                        player.equippedWeapon = player.hotbar[i] || "none";
                    }
                    
                    renderHudHotbar();
                    lastNetworkString = ""; // Tell the server the weapon state changed
                };
            }
        }
        
        // Render it once when the game loads
        setTimeout(renderHudHotbar, 500); // Slight delay ensures images load first
        
        function update() {
            // --- NEW: SLIDING COLLISION CHECK ---
            // Helper function to quickly check if a specific pixel hits a wall
            const checkWall = (x, y) => {
                const gx = Math.floor(x / TILE_SIZE);
                const gy = Math.floor(y / TILE_SIZE);
                for (let l = 0; l <= 7; l++) {
                    if (worldMap[`${gx},${gy},${l}`] && worldMap[`${gx},${gy},${l}`].hasCollision) return true;
                }
                return false;
            };

            // --- SI ESTOY MUERTO, NO ME PUEDO MOVER NI DISPARAR ---
            if (player.isDead) {
                player.vx = 0;
                player.vy = 0;
                player.isMoving = false;
                isShooting = false;
            }

            // 1. Try moving X first
            player.worldX += player.vx;
            if (checkWall(player.worldX, player.worldY)) {
                player.worldX -= player.vx; // Hit a wall horizontally? Undo X, keep Y moving!
            }

            // 2. Try moving Y second
            player.worldY += player.vy;
            if (checkWall(player.worldX, player.worldY)) {
                player.worldY -= player.vy; // Hit a wall vertically? Undo Y, keep X moving!
            }

// --- 3. SHOOTING & RELOADING PHYSICS ---
            const currentWeaponStats = WEAPONS[player.equippedWeapon] || WEAPONS["none"];

            if (isShooting && player.equippedWeapon !== "none" && !player.isReloading) {
                if (Date.now() - lastShotTime > currentWeaponStats.fireRate) {
                    
                    if (player.ammo > 0) {
                        // DISPARAR
                        player.ammo--;
                        let spawnX = player.worldX; let spawnY = player.worldY;

                        if (player.frameY === 0) { spawnX += 3; spawnY += 18; } 
                        else if (player.frameY === 1) { spawnX += 18; spawnY += 0; } 
                        else if (player.frameY === 2) { spawnX -= 18; spawnY -= 1; } 
                        else if (player.frameY === 3) { spawnX -= 5; spawnY -= 15; }

                        // Guardar para dibujar el fogonazo
                        player.lastShotX = spawnX; player.lastShotY = spawnY;

                        spawnProjectile(spawnX, spawnY, shootAngle, myId, player.equippedWeapon);
                        lastShotTime = Date.now();

                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ 
                                type: 'shoot', x: spawnX, y: spawnY, angle: shootAngle, weaponId: player.equippedWeapon 
                            }));
                        }
                    } else {
                        // RECARGAR AUTOMÁTICAMENTE
                        player.isReloading = true;
                        setTimeout(() => {
                            player.ammo = currentWeaponStats.magSize;
                            player.isReloading = false;
                        }, currentWeaponStats.reloadTime);
                    }
                }
            }

            // --- 4. BULLET MOVEMENT & PLAYER DAMAGE ---
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx; p.y += p.vy; p.life--;

                let hitSomeone = false;
                
                // --- EL FIX DE LA HITBOX ---
                // Reducido de 18 a 8. Ahora las balas tienen que dar casi en el centro del cuerpo!
                const HITBOX_RADIUS = 12; 

                // A. ¿La bala chocó contra MÍ (Local Player)?
                if (p.owner !== myId && Math.hypot(p.x - player.worldX, p.y - player.worldY) < HITBOX_RADIUS) {
                    hitSomeone = true; // Destruimos la bala visualmente
                }

                // B. ¿La bala chocó contra ALGUIEN MÁS?
                if (!hitSomeone) {
                    for (let id in otherPlayers) {
                        let enemy = otherPlayers[id];
                        // Verificamos que no sea el mismo dueño para no dispararnos a nosotros mismos
                        if (enemy.worldX !== undefined && p.owner !== id && Math.hypot(p.x - enemy.worldX, p.y - enemy.worldY) < HITBOX_RADIUS) {
                            hitSomeone = true;
                            
                            // SOLO SI YO DISPARÉ LA BALA, YO LE DIGO AL SERVIDOR QUE HUBo DAÑO
                            if (p.owner === myId) {
                                if (ws.readyState === WebSocket.OPEN) {
                                    ws.send(JSON.stringify({ type: 'damage_player', targetId: id }));
                                }
                            }
                            break; 
                        }
                    }
                }

                // Destruir la bala si toca una pared, se le acaba la vida, o tocó a alguien
                if (p.life <= 0 || checkWall(p.x, p.y) || hitSomeone) {
                    projectiles.splice(i, 1);
                }
            }
        
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            ctx.imageSmoothingEnabled = false; 
            ctx.webkitImageSmoothingEnabled = false;
        
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;   
        
            drawGrid(-player.worldX, -player.worldY);

            // HELPER FUNCTION: Draws a specific range of layers
            function drawWorldLayers(startLayer, endLayer) {
                const tilesPerRow = Math.floor(tilesetImage.width / TILE_SIZE);
                for (let currentLayer = startLayer; currentLayer <= endLayer; currentLayer++) {
                    if (editMode) ctx.globalAlpha = (currentLayer === activeLayer) ? 1.0 : 0.3;
                    else ctx.globalAlpha = 1.0;

                    for (let key in worldMap) {
                        const tileData = worldMap[key];
                        if (!tileData || tileData.l !== currentLayer) continue;
                        
                        const parts = key.split(',');
                        const tx = Number(parts[0]);
                        const ty = Number(parts[1]);
                        
                        const drawX = Math.round(screenCenterX + (tx * TILE_SIZE - player.worldX) * zoomLevel);
                        const drawY = Math.round(screenCenterY + (ty * TILE_SIZE - player.worldY) * zoomLevel);
                        const scaledSize = TILE_SIZE * zoomLevel;

                        const sx = (tileData.tileId % tilesPerRow) * TILE_SIZE;
                        const sy = Math.floor(tileData.tileId / tilesPerRow) * TILE_SIZE;
                        ctx.drawImage(tilesetImage, sx, sy, TILE_SIZE, TILE_SIZE, drawX, drawY, scaledSize, scaledSize);
                    }
                }
                ctx.globalAlpha = 1.0; 
            }

            // === 1. DRAW GROUND LAYERS (BELOW PLAYER: L0 - L3) ===
            drawWorldLayers(0, 3);

// === 2. DRAW PLAYER SPRITES ===
            updatePlayerDirection();
            
            // THE FIX: ALL SPRITES HAVE 6 ROWS OF GRID SPACE! 
            const frameWidth = player.currentImage.width / 8;
            const frameHeight = player.currentImage.height / 6; 

            // SAFETY CATCH: If you equip the gun while facing a row that is blank (like row 5), snap to 0!
            if (player.equippedWeapon === "ghost_gun" && player.frameY > 3) {
                player.frameY = 0;
            }

            const gunReady = ghostGunSprite.complete && ghostGunSprite.naturalWidth > 0;

            // --- A. DRAW OTHER PLAYERS ---
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                if (!p || p.worldX === undefined || !p.username) continue;
                
                // --- 1. THE SMOOTHING FIX ---
                // Lowered from 0.3 to 0.15. This stretches their movement over the 
                // full 50ms gap between network packets so they never completely stop!
                p.worldX += (p.targetX - p.worldX) * 0.15; 
                p.worldY += (p.targetY - p.worldY) * 0.15;

                // --- 2. THE LOCAL ANIMATION FIX ---
                // We advance their animation frames locally at 60fps so their legs 
                // move buttery smooth, instead of waiting for the 20fps network!
                p.tickCount = p.tickCount || 0;
                
                if (p.isMoving) {
                    p.tickCount++;
                    if (p.tickCount > player.ticksPerFrame) {
                        p.tickCount = 0;
                        p.frameX = (p.frameX + 1) % 8;
                    }
                } else {
                    if (p.equippedWeapon !== "ghost_gun") {
                        p.tickCount++;
                        if (p.tickCount > player.ticksPerFrame) {
                            p.tickCount = 0;
                            p.frameX = (p.frameX + 1) % 8;
                        }
                    }
                }
                
                let pImage = (p.equippedWeapon === "ghost_gun") ? walkAimSprite : (p.isMoving ? walkSprite : idleSprite);

                if (!pImage.complete || pImage.naturalWidth === 0) continue;
                if (p.equippedWeapon === "ghost_gun" && p.frameY > 3) p.frameY = 0;

                const pFrameWidth = pImage.width / 8;
                const pFrameHeight = pImage.height / 6; 
                
                // ... (Keep the rest of your drawing logic exactly the same from here down!)
                
                const pScaledWidth = pFrameWidth * zoomLevel;
                const pScaledHeight = pFrameHeight * zoomLevel;
                const pDrawX = Math.round(screenCenterX + ((p.worldX - player.worldX) * zoomLevel) - (pScaledWidth / 2));
                
                // The Body's Y Coordinate (STATIC)
                let pDrawY = Math.round(screenCenterY + ((p.worldY - player.worldY) * zoomLevel) - (pScaledHeight / 2));
                
                // --- NEW: THE INDEPENDENT GUN WOBBLE ---
                let pGunOffsetY = 0;
                if (!p.isMoving && p.equippedWeapon === "ghost_gun") {
                    pGunOffsetY = (Math.floor(Date.now() / 450) % 2) * zoomLevel;
                }

                let pDrawFrameX = p.frameX;
                if (p.equippedWeapon === "ghost_gun" && p.frameY === 1) pDrawFrameX = 7 - p.frameX; 

                const isFacingDown = (p.frameY === 0);
                const gunFrameW = gunReady ? ghostGunSprite.width / 8 : 0;
                const gunFrameH = gunReady ? ghostGunSprite.height / 6 : 0; 

                // --- THE FIX: ESTADO VISUAL (MUERTO O RECIBIENDO DAÑO) ---
                let pFilter = 'none';
                const timeSinceHit = Date.now() - (p.lastHitTime || 0);

                if (p.isDead) {
                    pFilter = 'grayscale(100%) opacity(50%)'; // Gris y fantasma
                } else if (timeSinceHit < 150) { 
                    // Si le pegaron hace menos de 150ms, filtro rojo intenso!
                    pFilter = 'brightness(40%) sepia(100%) hue-rotate(315deg) saturate(700%)';
                }
                
                ctx.filter = pFilter; // Aplicar filtro a TODO el personaje

                // 1. Draw Gun BEHIND
                if (!isFacingDown && p.equippedWeapon === "ghost_gun" && gunReady) {
                    ctx.drawImage(ghostGunSprite, pDrawFrameX * gunFrameW, p.frameY * gunFrameH, gunFrameW, gunFrameH, pDrawX, pDrawY + pGunOffsetY, pScaledWidth, pScaledHeight);
                }

                // --- 2. DRAW BODY IN TWO HALVES ---
                const pHalfH = pFrameHeight / 2;
                const pScaleHalfH = pScaledHeight / 2;
                
                // 2a. Bottom Half (Legs)
                ctx.drawImage(pImage, pDrawFrameX * pFrameWidth, p.frameY * pFrameHeight + pHalfH, pFrameWidth, pHalfH, pDrawX, pDrawY + pScaleHalfH, pScaledWidth, pScaleHalfH);
                
                // 2b. Top Half (Head & Torso)
                ctx.drawImage(pImage, pDrawFrameX * pFrameWidth, p.frameY * pFrameHeight, pFrameWidth, pHalfH, pDrawX, pDrawY + pGunOffsetY, pScaledWidth, pScaleHalfH);

                // 3. Draw Gun IN FRONT
                if (isFacingDown && p.equippedWeapon === "ghost_gun" && gunReady) {
                    ctx.drawImage(ghostGunSprite, pDrawFrameX * gunFrameW, p.frameY * gunFrameH, gunFrameW, gunFrameH, pDrawX, pDrawY + pGunOffsetY, pScaledWidth, pScaledHeight);
                }

                ctx.filter = 'none'; // SIEMPRE resetear el filtro AL FINAL
            }

            // --- B. DRAW LOCAL PLAYER ---
            const scaledWidth = frameWidth * zoomLevel;
            const scaledHeight = frameHeight * zoomLevel;
            const drawX = Math.round(screenCenterX - (scaledWidth / 2));
            
            // The Body's Y Coordinate (STATIC)
            let drawY = Math.round(screenCenterY - (scaledHeight / 2));
            
            // --- NEW: THE INDEPENDENT GUN WOBBLE (LOCAL) ---
            let localGunOffsetY = 0;
            if (!player.isMoving && player.equippedWeapon === "ghost_gun") {
                localGunOffsetY = (Math.floor(Date.now() / 450) % 2) * zoomLevel;
            }

            let localDrawFrameX = player.frameX;
            if (player.equippedWeapon === "ghost_gun" && player.frameY === 1) localDrawFrameX = 7 - player.frameX; 

            const localFacingDown = (player.frameY === 0);
            const localGunW = gunReady ? ghostGunSprite.width / 8 : 0;
            const localGunH = gunReady ? ghostGunSprite.height / 6 : 0; 

if (player.currentImage.complete && player.currentImage.naturalWidth > 0) {
                
                // --- THE FIX: TU PROPIO ESTADO VISUAL ---
                let localFilter = 'none';
                const localTimeSinceHit = Date.now() - (player.lastHitTime || 0);

                if (player.isDead) {
                    localFilter = 'grayscale(100%) opacity(50%)';
                } else if (localTimeSinceHit < 150) {
                    localFilter = 'brightness(40%) sepia(100%) hue-rotate(315deg) saturate(700%)';
                }

                ctx.filter = localFilter; // Aplicar a todo tu cuerpo y arma

                // 1. Draw Gun BEHIND 
                if (!localFacingDown && player.equippedWeapon === "ghost_gun" && gunReady) {
                    ctx.drawImage(ghostGunSprite, localDrawFrameX * localGunW, player.frameY * localGunH, localGunW, localGunH, drawX, drawY + localGunOffsetY, scaledWidth, scaledHeight);
                }

                // --- 2. DRAW BODY IN TWO HALVES ---
                const localHalfH = frameHeight / 2;
                const localScaleHalfH = scaledHeight / 2;
                
                // 2a. Bottom Half (Legs)
                ctx.drawImage(player.currentImage, localDrawFrameX * frameWidth, player.frameY * frameHeight + localHalfH, frameWidth, localHalfH, drawX, drawY + localScaleHalfH, scaledWidth, localScaleHalfH);
                
                // 2b. Top Half (Head & Torso)
                ctx.drawImage(player.currentImage, localDrawFrameX * frameWidth, player.frameY * frameHeight, frameWidth, localHalfH, drawX, drawY + localGunOffsetY, scaledWidth, localScaleHalfH);

                // 3. Draw Gun IN FRONT
                if (localFacingDown && player.equippedWeapon === "ghost_gun" && gunReady) {
                    ctx.drawImage(ghostGunSprite, localDrawFrameX * localGunW, player.frameY * localGunH, localGunW, localGunH, drawX, drawY + localGunOffsetY, scaledWidth, scaledHeight);
                }

                ctx.filter = 'none'; // Resetear al final
            }

            // --- NEW: DRAW PROJECTILES (GHOSTLY GREEN ORBS) ---
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#2ecc71"; // Glowing green
            ctx.fillStyle = "#2ecc71";
            
            for (let p of projectiles) {
                const pDrawX = Math.round(screenCenterX + (p.x - player.worldX) * zoomLevel);
                const pDrawY = Math.round(screenCenterY + (p.y - player.worldY) * zoomLevel);
                
                ctx.beginPath();
                // Draw a 3-pixel circle, scaled to zoom
                ctx.arc(pDrawX, pDrawY, 3 * zoomLevel, 0, Math.PI * 2); 
                ctx.fill();
            }
            // Reset shadows so the rest of the game doesn't glow!
            ctx.shadowBlur = 0; 
            
            // === 3. DRAW OVERHEAD LAYERS (ABOVE PLAYER: L4 - L7) ===
            drawWorldLayers(4, 7);

            // === 4. DRAW EDIT MODE UI (SELECTION BOXES) ===
            if (editMode) {
                let box = mapSelectionBox; 
                if (worldMode === 'select' && isDraggingMapBox && mapSelectStart && mapSelectEnd) {
                     box = {
                         minX: Math.min(mapSelectStart.x, mapSelectEnd.x), maxX: Math.max(mapSelectStart.x, mapSelectEnd.x),
                         minY: Math.min(mapSelectStart.y, mapSelectEnd.y), maxY: Math.max(mapSelectStart.y, mapSelectEnd.y)
                     };
                }
                
                if (box) {
                    const w = (box.maxX - box.minX + 1) * TILE_SIZE * zoomLevel;
                    const h = (box.maxY - box.minY + 1) * TILE_SIZE * zoomLevel;
                    const bx = Math.round(screenCenterX + (box.minX * TILE_SIZE - player.worldX) * zoomLevel);
                    const by = Math.round(screenCenterY + (box.minY * TILE_SIZE - player.worldY) * zoomLevel);
                    
                    ctx.strokeStyle = '#8e44ad'; ctx.lineWidth = 2 * zoomLevel; ctx.strokeRect(bx, by, w, h);
                    ctx.fillStyle = 'rgba(142, 68, 173, 0.3)'; ctx.fillRect(bx, by, w, h);
                } else if (inspectingCoord && !mapSelectionBox) {
                    const [gx, gy, gl] = inspectingCoord.split(',').map(Number);
                    if (gl === activeLayer) {
                        const bx = Math.round(screenCenterX + (gx * TILE_SIZE - player.worldX) * zoomLevel);
                        const by = Math.round(screenCenterY + (gy * TILE_SIZE - player.worldY) * zoomLevel);
                        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2 * zoomLevel; ctx.strokeRect(bx, by, TILE_SIZE * zoomLevel, TILE_SIZE * zoomLevel);
                    }
                }
            }

// === DIBUJAR EL FOGONAZO (MUZZLE FLASH) ===
            // Dura solo 50 milisegundos en pantalla tras cada disparo
            if (Date.now() - lastShotTime < 50 && player.equippedWeapon !== "none") {
                const fX = Math.round(screenCenterX + (player.lastShotX - player.worldX) * zoomLevel);
                const fY = Math.round(screenCenterY + (player.lastShotY - player.worldY) * zoomLevel);
                
                ctx.fillStyle = WEAPONS[player.equippedWeapon].color;
                ctx.shadowBlur = 15; ctx.shadowColor = WEAPONS[player.equippedWeapon].color;
                ctx.beginPath();
                ctx.arc(fX, fY, 8 * zoomLevel, 0, Math.PI * 2); 
                ctx.fill();
                ctx.shadowBlur = 0; 
            }

            // --- HELPER: Dibujar Barra de Vida Dinámica ---
            function drawHealthBar(x, y, hp, maxHp, scaledWidth, lastHit) {
                const timeSinceHit = Date.now() - (lastHit || 0);
                
                // Si pasaron más de 4 segundos sin recibir daño, ocultar la barra
                if (timeSinceHit > 4000 && hp === maxHp) return; 

                // Desvanecer (Fade out) suavemente durante el último segundo
                let alpha = 1.0;
                if (timeSinceHit > 3000 && hp === maxHp) {
                    alpha = 1.0 - ((timeSinceHit - 3000) / 1000);
                }

                ctx.globalAlpha = alpha;

                // Barra más pequeña, centrada y pegada a la cabeza
                const barW = 24 * zoomLevel; 
                const barH = 4 * zoomLevel;
                const barX = x + (scaledWidth / 2) - (barW / 2);
                const barY = y - (8 * zoomLevel); 
                
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(barX, barY, barW, barH);
                
                const healthPercent = Math.max(0, hp / maxHp);
                ctx.fillStyle = healthPercent > 0.3 ? "#2ecc71" : "#e74c3c"; 
                ctx.fillRect(barX, barY, barW * healthPercent, barH);

                ctx.globalAlpha = 1.0; // Resetear transparencia para lo demás
            }

            // === 5. DRAW NAMETAGS, BUBBLES & HEALTH BARS ===
            for (let id in otherPlayers) {
                const p = otherPlayers[id];
                if (!p || p.worldX === undefined || !p.username) continue;
                
                const pDrawX = Math.round(screenCenterX + ((p.worldX - player.worldX) * zoomLevel) - (scaledWidth / 2));
                const pDrawY = Math.round(screenCenterY + ((p.worldY - player.worldY) * zoomLevel) - (scaledHeight / 2));
                
                const currentHp = p.hp !== undefined ? p.hp : 100;
                drawHealthBar(pDrawX, pDrawY, currentHp, 100, scaledWidth, p.lastHitTime);

                drawDynamicBubble(p.message, p.messageTimer, p.isTyping, pDrawX, pDrawY, scaledWidth);
                drawNametag(p.username, pDrawX, pDrawY, scaledWidth, scaledHeight, getColorForString(p.username));
            }

            // Dibujar TU barra de vida
            drawHealthBar(drawX, drawY, player.hp, player.maxHp, scaledWidth, player.lastHitTime);
            drawDynamicBubble(player.message, player.messageTimer, player.isTyping, drawX, drawY, scaledWidth);
            drawNametag(player.username, drawX, drawY, scaledWidth, scaledHeight, "#f1c40f");

            if (player.messageTimer > 0) player.messageTimer--;

            // === DIBUJAR NÚMEROS DE DAÑO (ESTILO FORTNITE) ===
            for (let i = damageTexts.length - 1; i >= 0; i--) {
                let dt = damageTexts[i];
                dt.life--;
                dt.y -= 0.6; // El texto flota hacia arriba

                const dtDrawX = Math.round(screenCenterX + (dt.x - player.worldX) * zoomLevel);
                const dtDrawY = Math.round(screenCenterY + (dt.y - player.worldY) * zoomLevel);

                // Se desvanece a la mitad de su vida
                ctx.globalAlpha = Math.max(0, dt.life / (dt.maxLife / 2));
                
                const fontSize = 10 * zoomLevel;
                ctx.font = `900 ${fontSize}px sans-serif`; // Fuente gruesa (Bold)
                ctx.textAlign = "center";
                ctx.lineWidth = 3 * zoomLevel; // Borde negro grueso
                ctx.strokeStyle = "black";
                ctx.lineJoin = "round";
                
                ctx.strokeText(dt.text, dtDrawX, dtDrawY);
                ctx.fillStyle = "#f1c40f"; // Amarillo / Naranja brillante
                ctx.fillText(dt.text, dtDrawX, dtDrawY);

                if (dt.life <= 0) damageTexts.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;

            // --- NEW: UPDATE THE MINIMAP IF OPEN ---
            if (isMapOpen) drawMinimap();    

            requestAnimationFrame(update);
        }

        update();

    </script>
</body>
</html>
