<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liros | Links Oficiales</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- FONTS --- */
        @font-face { font-family: 'HK Grotesk Wide'; src: url('fonts/HKGroteskWide-Regular.otf'); }
        @font-face { font-family: 'HK Grotesk Wide'; src: url('fonts/HKGroteskWide-Bold.otf'); font-weight: 700; }
        @font-face { font-family: 'HK Grotesk Wide'; src: url('fonts/HKGroteskWide-Black.otf'); font-weight: 900; }

        /* --- THEME VARS --- */
        :root {
            --bg-main: #e3e3e3;
            --text-dark: #050505;
            --text-grey: #666666;
            --accent: #4a6fa5;       
            --accent-soft: #a8c0dd;  
            --font: 'HK Grotesk Wide', sans-serif;
            --c-glass: #ffffff;
            --saturation: 110%;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background-color: var(--bg-main);
            color: var(--text-dark);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- BACKGROUND FX --- */
        .corner-glow {
            position: fixed; width: 900px; height: 900px; border-radius: 50%;
            filter: blur(120px); z-index: -2; opacity: 0.4; pointer-events: none;
        }
        .glow-tr { top: -400px; right: -400px; background: radial-gradient(circle, var(--accent-soft), transparent 70%); }
        .glow-bl { bottom: -400px; left: -400px; background: radial-gradient(circle, var(--accent), transparent 70%); }

        /* --- SHARED LIQUID GLASS STYLE --- */
        .liquid-glass {
            background-color: color-mix(in srgb, var(--c-glass) 12%, transparent);
            backdrop-filter: blur(12px) saturate(var(--saturation));
            -webkit-backdrop-filter: blur(12px) saturate(var(--saturation));
            box-shadow: inset 0 0 0 1px color-mix(in srgb, #ffffff88 10%, #00000000), 
                        inset 1.8px 3px 2px -2px color-mix(in srgb, #ffffff99 90%, #00000000), 
                        inset -1.8px -3px 2px -2px color-mix(in srgb, #ffffff 80%, #00000000), 
                        0px 6px 16px 0px rgba(0,0,0,0.05);
        }

        /* --- GENERAL UI --- */
        h1, h2, h3 { font-weight: 900; text-transform: uppercase; letter-spacing: -1px; }
        
        .hero { margin-top: 50px; text-align: center; margin-bottom: 30px; }
        .hero h1 { font-size: 3rem; margin-bottom: 5px; color: var(--text-dark); }
        .hero p { font-size: 1rem; color: var(--text-grey); letter-spacing: 2px; }

        .container { width: 100%; max-width: 600px; padding: 20px; z-index: 1; }

        .liquid-box {
            position: relative; padding: 20px; border-radius: 32px;
            background-color: color-mix(in srgb, var(--c-glass) 12%, transparent);
            backdrop-filter: blur(10px) saturate(var(--saturation));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), 0px 10px 30px -10px rgba(0,0,0,0.1);
        }

        @keyframes pulse-aura {
            0% { box-shadow: 0 0 0 0px rgba(74, 111, 165, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(74, 111, 165, 0); }
            100% { box-shadow: 0 0 0 0px rgba(74, 111, 165, 0); }
        }
        .featured-pulse { animation: pulse-aura 2s infinite; margin-bottom: 20px; }

        /* --- NEWSLETTER COMPRIMIDO --- */
        .newsletter-section {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 24px;
        }
        .newsletter-section h3 { margin-bottom: 5px; font-size: 1.2rem; color: var(--text-dark); }
        .newsletter-section p { font-size: 0.85rem; color: var(--text-grey); margin-bottom: 15px; }
        
        .compact-form {
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
        }

        .input-glass {
            flex-grow: 1;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
            font-family: var(--font);
            font-size: 0.9rem;
            color: var(--text-dark);
            outline: none;
            transition: 0.3s;
        }
        .input-glass::placeholder { color: var(--text-grey); opacity: 0.7; }
        .input-glass:focus { background: rgba(255, 255, 255, 0.5); border-color: var(--accent); }

        .btn-submit {
            padding: 12px 25px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-family: var(--font);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-submit:hover { background: var(--text-dark); }
        .btn-submit:active { transform: scale(0.96); }

        /* En celulares, apilamos el input y el botón para que no quede muy apretado */
        @media(max-width: 480px) {
            .compact-form { flex-direction: column; }
            .input-glass, .btn-submit { width: 100%; }
        }

        /* --- LINKS --- */
        .link-tree-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        
        .link-card {
            display: flex; align-items: center; padding: 18px 25px; border-radius: 20px;
            text-decoration: none; color: var(--text-dark); font-weight: 700;
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .link-card i:first-child { font-size: 1.5rem; width: 40px; color: var(--accent); }
        .link-card span { flex-grow: 1; letter-spacing: 1px; font-size: 0.95rem; }
        .link-card i:last-child { font-size: 0.8rem; opacity: 0.5; }
        .link-card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s; pointer-events: none;
        } 
        @media (hover: hover) {
            .link-card:hover { transform: translateX(5px); background-color: color-mix(in srgb, var(--c-glass) 40%, transparent); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
            .link-card:hover::after { left: 150%; }
        }
        .link-card:active { transform: scale(0.96) !important; transition: 0.1s; }

        footer { text-align: center; padding: 40px 20px; color: var(--text-grey); font-size: 0.8rem; margin-top: auto; }
    </style>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '4579823242338247');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=4579823242338247&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

</head>
<body>

    <div class="corner-glow glow-tr"></div>
    <div class="corner-glow glow-bl"></div>

    <div class="container">
        <header class="hero">
            <h1>LIROS</h1>
        </header>
        
        <div id="spotify-player"></div>

        <div class="liquid-box newsletter-section">
            <h3>Únete a la Clika</h3>
            <p>Deja tu correo para rolas inéditas y accesos especiales.</p>
            
            <form id="newsletter-form" class="compact-form" onsubmit="handleSubscribe(event)">
                <input type="email" id="email-input" class="input-glass" placeholder="tu@correo.com" required>
                <button type="submit" class="btn-submit">Unirme</button>
            </form>
            <p id="form-message" style="display: none; margin-top: 10px; font-size: 0.85rem; font-weight: bold;"></p>
        </div>
    
        <div id="link-tree-list" class="link-tree-container"></div>

        <div id="tiktok-player" style="margin-bottom: 20px;"></div>
    </div>

    <footer>
        <p>© 2026 Liros Music.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- CONFIGURACIÓN DE DATOS ---
        const profileData = {
            spotify: { 
                id: "0jJBTP1lRCe35zspJBa94D", // Tu ID de Spotify
            },
            tiktok: {
                id: "7616192281871142164" // PON AQUÍ TU ID DE TIKTOK REAL
            },
            links: [
                { name: 'Spotify', icon: 'fab fa-spotify', url: 'https://open.spotify.com/intl-es/artist/5YtRkkyiXntYnEZWO4kUxB', color: '#1DB954' },
                { name: 'Apple Music', icon: 'fab fa-apple', url: 'https://music.apple.com/mx/artist/liros/1639080261', color: '#FC3C44' },
                { name: 'Instagram', icon: 'fab fa-instagram', url: 'https://instagram.com/liros__', color: '#E1306C' },
                { name: 'Youtube', icon: 'fab fa-youtube', url: 'https://www.youtube.com/@liros__', color: '#FF0000' },
                { name: 'TikTok', icon: 'fab fa-tiktok', url: 'https://www.tiktok.com/@liroscuh', color: '#000000' },
            ]
        };

        // --- RENDERIZAR VISTAS ---
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Render Spotify
            const spotifyContainer = document.getElementById('spotify-player');
            if (profileData.spotify && profileData.spotify.id) {
                spotifyContainer.innerHTML = `
                    <div class="liquid-box featured-pulse">
                        <iframe style="border-radius:15px" src="https://open.spotify.com/embed/track/${profileData.spotify.id}?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                    </div>
                `;
            }

            // 2. Render Links
            const listContainer = document.getElementById('link-tree-list');
            profileData.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url; a.target = "_blank";
                a.className = "link-card liquid-glass";
                a.innerHTML = `<i class="${link.icon}" style="color: ${link.color}"></i><span>${link.name}</span><i class="fas fa-chevron-right"></i>`;
                listContainer.appendChild(a);
            });

            // 3. Render TikTok (Abajo de los links)
            const tiktokContainer = document.getElementById('tiktok-player');
            if (profileData.tiktok && profileData.tiktok.id) {
                tiktokContainer.innerHTML = `
                    <p style="font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 15px; color: var(--text-grey); text-align: center;">ÚLTIMO VIDEO</p>
                    <div class="liquid-box" style="padding: 10px;">
                        <iframe src="https://www.tiktok.com/embed/v2/${profileData.tiktok.id}" width="100%" height="740" frameborder="0" allowfullscreen style="border-radius:20px; background: transparent;"></iframe>
                    </div>
                `;
            }
        });

        // --- CONFIGURACIÓN DE SUPABASE ---
        // ¡No olvides poner tus credenciales reales aquí!
        const supabaseUrl = 'https://hwsffnsxwxygvamqdxcd.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3c2ZmbnN4d3h5Z3ZhbXFkeGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwMzM2MTIsImV4cCI6MjA4NDYwOTYxMn0.1cslca0G6SMjGv2UBiRCYJsTNelc8vfhCixErap-2hU';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- LÓGICA DEL FORMULARIO DE CORREOS ---
        async function handleSubscribe(event) {
            event.preventDefault(); 
            
            const emailInput = document.getElementById('email-input');
            const email = emailInput.value;
            const messageEl = document.getElementById('form-message');
            const form = document.getElementById('newsletter-form');
            const submitBtn = document.querySelector('.btn-submit');

            // Filtro estricto de correo
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
            if (!emailRegex.test(email)) {
                messageEl.innerText = "Ese correo no parece válido, compa. Revísalo bien.";
                messageEl.style.display = 'block';
                messageEl.style.color = '#d9534f'; 
                return; 
            }

            // Estado de carga
            submitBtn.disabled = true;
            submitBtn.innerText = 'Enviando...';
            submitBtn.style.opacity = '0.7';

            // Insertar en Supabase
            const { data, error } = await supabaseClient
                .from('subscribers')
                .insert([{ email: email }]);

            if (error) {
                console.error("Error guardando correo:", error);
                
                if (error.code === '23505') { 
                    messageEl.innerText = "Este correo ya está registrado en la clika.";
                } else {
                    messageEl.innerText = "Hubo un error. Intenta de nuevo, por favor.";
                }
                
                messageEl.style.display = 'block';
                messageEl.style.color = '#d9534f'; 
                
                submitBtn.disabled = false;
                submitBtn.innerText = 'Unirme';
                submitBtn.style.opacity = '1';
                
            } else {
                form.style.display = 'none';
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--accent)'; 
                messageEl.innerText = "¡Listo! Ya estás en la lista. Pendiente a las próximas rolas.";
            
                // AVISO A META DEL NUEVO FAN REGISTRADO
                if (typeof fbq === 'function') {
                    fbq('track', 'Lead');
                }
            }
        }
    </script>
</body>
</html>
