<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liros | Task Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        /* --- FONTS --- */
        @font-face { font-family: 'HK Grotesk Wide'; src: url('../fonts/HKGroteskWide-Regular.otf'); }
        @font-face { font-family: 'HK Grotesk Wide'; src: url('../fonts/HKGroteskWide-Bold.otf'); font-weight: 700; }
        @font-face { font-family: 'HK Grotesk Wide'; src: url('../fonts/HKGroteskWide-Black.otf'); font-weight: 900; }

        /* --- THEME VARS --- */
        :root {
            --bg-main: #e3e3e3;
            --text-dark: #050505;
            --text-grey: #666666;
            --accent: #4a6fa5;       
            --accent-soft: #a8c0dd;  
            --font: 'HK Grotesk Wide', sans-serif;
            --c-glass: #ffffff;
            --c-dark: #222222;
            --saturation: 110%;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        
        body {
            font-family: var(--font);
            background-color: var(--bg-main);
            color: var(--text-dark);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px; 
        }

        /* --- BACKGROUND FX --- */
        .corner-glow {
            position: fixed; width: 900px; height: 900px; border-radius: 50%;
            filter: blur(120px); z-index: -2; opacity: 0.4; pointer-events: none;
        }
        .glow-tr { top: -400px; right: -400px; background: radial-gradient(circle, var(--accent-soft), transparent 70%); }
        .glow-bl { bottom: -400px; left: -400px; background: radial-gradient(circle, var(--accent), transparent 70%); }

        /* --- CURSOR --- */
        .cursor {
            position: fixed; width: 30px; height: 30px;
            border: 2px solid var(--accent); border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transition: transform 0.1s;
            display: flex; justify-content: center; align-items: center;
        }
        .cursor-inner { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
        .cursor.hover { transform: scale(1.8); background: rgba(74, 111, 165, 0.1); }

        /* --- LIQUID GLASS STYLES --- */
        .liquid-box {
            position: relative; padding: 35px 25px; border-radius: 32px;
            background-color: color-mix(in srgb, var(--c-glass) 12%, transparent);
            backdrop-filter: blur(12px) saturate(var(--saturation));
            -webkit-backdrop-filter: blur(12px) saturate(var(--saturation));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), 0px 10px 30px -10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        .task-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; margin-bottom: 12px; border-radius: 18px;
            background-color: color-mix(in srgb, var(--c-glass) 40%, transparent);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0px 4px 10px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            touch-action: manipulation; /* Helps with mobile tap vs drag */
        }

        /* SortableJS Ghost class (Visual feedback when dragging) */
        .sortable-ghost {
            opacity: 0.3;
            background-color: var(--accent-soft);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        /* --- TYPOGRAPHY & UI --- */
        h2 { font-weight: 900; text-transform: uppercase; letter-spacing: -1px; text-align: center; margin-bottom: 25px; color: var(--text-dark); }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 25px; }
        
        input[type="text"] {
            flex-grow: 1; padding: 15px 20px;
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 30px; font-family: var(--font);
            color: var(--text-dark); font-size: 16px; 
            outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { background: rgba(255,255,255,0.8); box-shadow: 0 0 15px rgba(74, 111, 165, 0.2); }
        
        .btn { 
            padding: 15px 25px; border: 2px solid var(--text-dark); border-radius: 30px;
            background: transparent; color: var(--text-dark); 
            font-family: var(--font); font-weight: 700; text-transform: uppercase; 
            letter-spacing: 1px; transition: 0.3s; display: inline-block;
        }
        .btn:hover { background: var(--text-dark); color: white; }

        ul { list-style: none; padding: 0; margin: 0; }
        
        .task-text { flex-grow: 1; font-weight: 700; font-size: 0.95rem; transition: color 0.3s, opacity 0.3s; padding-right: 10px; }
        .task-text.done { text-decoration: line-through; opacity: 0.4; }

        .action-btns { display: flex; gap: 12px; }
        
        .icon-btn {
            background: transparent; border: none; color: var(--text-grey);
            font-size: 1.1rem; padding: 5px; transition: 0.3s;
            position: relative; z-index: 10; /* Keeps buttons clickable during drag events */
        }
        .icon-btn:hover { color: var(--accent); transform: scale(1.1); }
        .icon-btn.delete:hover { color: #cf6679; }

        /* --- DIVIDER STYLES --- */
        .divider {
            height: 1px; border: none;
            background: color-mix(in srgb, var(--text-grey) 20%, transparent);
            margin: 25px 0;
        }
        .done-label {
            text-align: center; font-size: 0.75rem; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-grey); margin-bottom: 15px;
        }

        /* --- MOBILE TWEAKS --- */
        @media(max-width: 768px) {
            * { cursor: auto; }
            .cursor { display: none; }
            .liquid-box { padding: 25px 15px; }
            .btn:active { transform: scale(0.96); background: var(--text-dark); color: white; }
            .icon-btn:active { transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <div class="corner-glow glow-tr"></div>
    <div class="corner-glow glow-bl"></div>
    <div class="cursor" id="cursor"><div class="cursor-inner"></div></div>

    <div class="liquid-box">
        <h2>System Tasks</h2>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Escribe una tarea o pregunta..." onkeypress="handleKeyPress(event)">
            <button class="btn" onclick="addTask()">ADD</button>
            <button class="btn" onclick="askGeminiText()" style="border-color: var(--accent);"><i class="fas fa-robot"></i></button>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" id="micBtn" onclick="startVoiceAssistant()" style="border-color: var(--accent-soft); font-size: 0.8rem;">
                <i class="fas fa-microphone"></i> <span id="micStatus">USAR VOZ</span>
            </button>
        </div>

        <div id="taskListContainer"></div>
    </div>


    <script>
        // --- 1. CONFIGURATION ---
        const { createClient } = supabase;
        const supabaseUrl = 'https://hwsffnsxwxygvamqdxcd.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3c2ZmbnN4d3h5Z3ZhbXFkeGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwMzM2MTIsImV4cCI6MjA4NDYwOTYxMn0.1cslca0G6SMjGv2UBiRCYJsTNelc8vfhCixErap-2hU';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        let tasks = [];
        let sortableInstance = null;

        // --- 2. DATABASE LOGIC ---
        async function loadTasks() {
            // Now ordering by the new 'position' column
            const { data, error } = await supabaseClient
                .from('tasks')
                .select('*')
                .order('position', { ascending: true }) 
                .order('id', { ascending: false });
                
            if (!error) { tasks = data; renderTasks(); }
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (text) {
                // Generate a negative timestamp so new tasks naturally fall to the very top of the list
                const newPosition = -Date.now();
                
                const { data, error } = await supabaseClient
                    .from('tasks')
                    .insert([{ task_text: text, is_done: false, position: newPosition }])
                    .select();
                    
                if (!error && data) { 
                    tasks.unshift(data[0]); 
                    input.value = ''; 
                    renderTasks(); 
                }
            }
        }

        async function editTask(id, currentText) {
            const newText = prompt("Edit your task:", currentText);
            if (newText !== null && newText.trim() !== "" && newText !== currentText) {
                const { error } = await supabaseClient.from('tasks').update({ task_text: newText.trim() }).eq('id', id);
                if (!error) {
                    const taskIndex = tasks.findIndex(t => t.id === id);
                    if (taskIndex !== -1) { tasks[taskIndex].task_text = newText.trim(); renderTasks(); }
                }
            }
        }

        async function toggleTask(id, currentStatus) {
            const newStatus = !currentStatus;
            const { error } = await supabaseClient.from('tasks').update({ is_done: newStatus }).eq('id', id);
            if (!error) {
                const taskIndex = tasks.findIndex(t => t.id === id);
                if (taskIndex !== -1) { tasks[taskIndex].is_done = newStatus; renderTasks(); }
            }
        }

        async function deleteTask(id) {
            const { error } = await supabaseClient.from('tasks').delete().eq('id', id);
            if (!error) { tasks = tasks.filter(t => t.id !== id); renderTasks(); }
        }

        // --- 3. UI RENDERING & DRAG LOGIC ---
        function createTaskElement(task) {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.dataset.id = task.id; // Store ID on the HTML element for dragging
            
            const span = document.createElement('span');
            span.className = `task-text ${task.is_done ? 'done' : ''}`;
            span.textContent = task.task_text;
            span.onclick = () => toggleTask(task.id, task.is_done);

            const actions = document.createElement('div');
            actions.className = 'action-btns';

            if (!task.is_done) {
                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn edit';
                editBtn.innerHTML = '<i class="fas fa-pen"></i>';
                editBtn.onclick = () => editTask(task.id, task.task_text);
                actions.appendChild(editBtn);
            }

            const delBtn = document.createElement('button');
            delBtn.className = 'icon-btn delete';
            delBtn.innerHTML = '<i class="fas fa-trash"></i>';
            delBtn.onclick = () => deleteTask(task.id);
            actions.appendChild(delBtn);

            li.appendChild(span);
            li.appendChild(actions);
            return li;
        }

        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            container.innerHTML = ''; 
            
            const pendingTasks = tasks.filter(t => !t.is_done);
            const doneTasks = tasks.filter(t => t.is_done);

            // Render Pending Tasks (Draggable)
            if (pendingTasks.length > 0) {
                const pendingList = document.createElement('ul');
                pendingList.id = "pendingList";
                pendingTasks.forEach(task => pendingList.appendChild(createTaskElement(task)));
                container.appendChild(pendingList);

                // Initialize SortableJS on the pending list
                sortableInstance = new Sortable(pendingList, {
                    animation: 150,
                    delay: 200, // 200ms long press to drag
                    delayOnTouchOnly: true, // Only require long press on touch screens
                    ghostClass: 'sortable-ghost',
                    onEnd: async function () {
                        // When drag ends, update the position in the database
                        const items = Array.from(pendingList.children);
                        for (let i = 0; i < items.length; i++) {
                            const taskId = parseInt(items[i].dataset.id);
                            const task = tasks.find(t => t.id === taskId);
                            if (task && task.position !== i) {
                                task.position = i;
                                // Silently update Supabase in the background
                                await supabaseClient.from('tasks').update({ position: i }).eq('id', taskId);
                            }
                        }
                    }
                });
            }

            // Render Completed Tasks (Not Draggable)
            if (doneTasks.length > 0) {
                if (pendingTasks.length > 0) {
                    const divider = document.createElement('hr');
                    divider.className = 'divider';
                    container.appendChild(divider);
                }
                
                const label = document.createElement('div');
                label.className = 'done-label';
                label.textContent = 'Completed';
                container.appendChild(label);

                const doneList = document.createElement('ul');
                doneTasks.forEach(task => doneList.appendChild(createTaskElement(task)));
                container.appendChild(doneList);
            }
        }

        function handleKeyPress(event) { if (event.key === 'Enter') addTask(); }

        // --- 4. CURSOR LOGIC ---
        if (window.innerWidth > 768) {
            const cursor = document.getElementById('cursor');
            document.addEventListener('mousemove', e => {
                cursor.style.left = e.clientX - 15 + 'px';
                cursor.style.top = e.clientY - 15 + 'px';
            });
            document.body.addEventListener('mouseenter', (e) => {
                if(e.target.closest('button, input, .task-text, .icon-btn')) cursor.classList.add('hover');
            }, true);
            document.body.addEventListener('mouseleave', (e) => {
                if(e.target.closest('button, input, .task-text, .icon-btn')) cursor.classList.remove('hover');
            }, true);
        }

        // --- 5. AI VOICE ASSISTANT (GEMINI) ---
        const GEMINI_API_KEY = 'AIzaSyATgHyPywddkXLkas0BAelTmpwgWRV3oGg'; // ¡Pon tu llave aquí!

// --- LÓGICA DE VOZ (SÍNTESIS) ---
        function speak(text) {
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-MX'; // Acento latino/mexicano
            utterance.rate = 1.05; 
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
        
// --- FUNCIÓN PARA CONSULTAR POR TEXTO ---
        async function askGeminiText() {
            // 🚨 EL TRUCO PARA iPHONE: Reproducir un texto vacío inmediatamente al tocar el botón para "desbloquear" el audio
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

            const input = document.getElementById('taskInput');
            const prompt = input.value.trim();
            const status = document.getElementById('micStatus');

            if (!prompt) return;

            status.textContent = "PENSANDO...";
            
            const aiResponse = await askGemini(prompt);
            
            speak(aiResponse);
            
            input.value = '';
            status.textContent = "AI LISTA";
            setTimeout(() => status.textContent = "USAR VOZ", 3000);
        }

       async function askGemini(prompt) {
        const GEMINI_API_KEY = 'AIzaSyATgHyPywddkXLkas0BAelTmpwgWRV3oGg'; 
        
        // Cambiamos a v1beta y nos aseguramos de que el modelo esté bien escrito
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

        const body = {
            contents: [{
                parts: [{ text: prompt }]
            }],
            generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 100,
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            // Si la API nos devuelve un error, lo capturamos aquí
            if (data.error) {
                console.error("Detalle del error:", data.error);
                return "Error de la IA: " + data.error.message;
            }

            // Acceso seguro a la respuesta
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                return data.candidates[0].content.parts[0].text;
            }
            
            return "No obtuve una respuesta clara.";

            } catch (error) {
                console.error("Error de conexión:", error);
                return "Error de red al conectar con Liros.";
            }
        }

        function startVoiceAssistant() {
            // 🚨 EL TRUCO PARA iPHONE: Desbloquear el audio aquí también
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            const status = document.getElementById('micStatus');
            
            // También le ponemos español de México para que te entienda mejor el dictado
            recognition.lang = 'es-MX';
            recognition.start();

            recognition.onstart = () => {
                status.textContent = "ESCUCHANDO...";
                document.getElementById('micBtn').style.background = "var(--accent-soft)";
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                status.textContent = "PENSANDO...";
                
                const aiResponse = await askGemini(transcript);
                
                speak(aiResponse);
                
                status.textContent = "AI ASSISTANT";
                document.getElementById('micBtn').style.background = "transparent";
            };

            recognition.onerror = () => {
                status.textContent = "ERROR";
                setTimeout(() => status.textContent = "AI ASSISTANT", 2000);
            };
        }

        // --- 6. HACK PARA AUDÍFONOS (MEDIA SESSION API) ---
        
        // Creamos un audio MP3 de 1 segundo de puro silencio absoluto
        const silentAudio = new Audio('data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//MUxAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//MUxDsAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq');
        silentAudio.loop = true; // Se repite infinitamente para que iOS no nos quite el control

        function initHeadsetControl() {
            // Reproducimos el silencio
            silentAudio.play().catch(e => console.log("Esperando toque del usuario para iniciar audio..."));

            // Conectamos los controles del iPhone a nuestra página
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'IA Liros',
                    artist: 'Escuchando comandos...',
                    // Puedes poner una URL de una imagen tuya aquí para que salga en la pantalla de bloqueo
                    artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/8644/8644104.png', sizes: '512x512', type: 'image/png' }] 
                });

                // Cuando presionas el botón "Play" en tu audífono
                navigator.mediaSession.setActionHandler('play', function() {
                    silentAudio.play(); // Forzamos que siga el silencio
                    startVoiceAssistant(); // ¡Llamamos a tu IA!
                });

                // Cuando presionas el botón "Pause" en tu audífono (A veces iOS alterna entre play/pause)
                navigator.mediaSession.setActionHandler('pause', function() {
                    silentAudio.play(); // Evitamos que se pause de verdad
                    startVoiceAssistant(); // ¡Llamamos a tu IA!
                });
            }
        }

        // EVENTO CLAVE: Desbloqueamos este superpoder con el primer toque en la pantalla
        document.body.addEventListener('touchstart', function() {
            if(silentAudio.paused) {
                initHeadsetControl();
            }
        }, { once: true }); // El "once: true" asegura que solo se ejecute la primera vez

        // Initialize
        loadTasks();
    </script>
</body>
</html>
